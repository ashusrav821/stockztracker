<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Pro Tracker</title>
    <meta name="theme-color" id="theme-meta" content="#000000">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- Dark Theme --- */
        :root {
            --bg-base: #0a0a0f;
            --header-bg: #0a0a0f;
            --card-bg: #111118;
            --card-border: #2e2e40;
            --text-main: #f0f0f8;
            --text-sub: #8a8aa3;
            --text-mid: #9898b0;
            --accent: #635af5;
            --accent-dim: rgba(99, 90, 245, 0.14);
            --buy-color: #00d395;
            --buy-dim: rgba(0, 211, 149, 0.12);
            --sell-color: #ff5c5c;
            --sell-dim: rgba(255, 92, 92, 0.12);
            --hold-color: #f5a623;
            --hold-dim: rgba(245, 166, 35, 0.12);
            --input-bg: #1c1c28;
            --input-border: #8a8aa8;
            --hover-bg: #1a1a26;
            --divider: #2a2a3a;
            --stripe-buy: var(--buy-color);
            --stripe-sell: var(--sell-color);
            --stripe-hold: var(--hold-color);
        }

        /* --- Light Theme --- */
        body.light-mode {
            --bg-base: #f4f4f8;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #d0d0e0;
            --text-main: #0f0f1a;
            --text-sub: #6a6a84;
            --text-mid: #606078;
            --accent: #5b54e8;
            --accent-dim: rgba(91, 84, 232, 0.08);
            --buy-color: #008052;
            --buy-dim: rgba(0, 128, 82, 0.10);
            --sell-color: #d63232;
            --sell-dim: rgba(214, 50, 50, 0.10);
            --hold-color: #a56907;
            --hold-dim: rgba(165, 105, 7, 0.10);
            --input-bg: #ffffff;
            --input-border: #7a7a96;
            --hover-bg: #ebebf4;
            --divider: #dcdce8;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        /* ---- FORM CONTROL BASELINE ----
           Guarantees every input/select/textarea is legible in both themes, even if a more
           specific rule forgets one of these. Two things this fixes in particular:
           1. Native <select> dropdown OPTIONS inherit the OS default (light) background on
              Android/Windows, so dark-theme text was rendering near-invisible against it —
              options need their colors set explicitly, separately from the select itself.
           2. Placeholders default to a low-contrast UA gray that all but disappears on the
              near-black background. */
        input, select, textarea {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-family: inherit;
        }
        select option {
            background: var(--card-bg);
            color: var(--text-main);
        }
        input::placeholder, textarea::placeholder {
            color: var(--text-sub);
            opacity: 1; /* Firefox dims placeholders by default on top of the color */
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }
        /* Force the theme's text color through on iOS, which otherwise overrides it on
           disabled/auto-filled fields with its own near-invisible default. */
        input, textarea { -webkit-text-fill-color: var(--text-main); }

        html, body { overflow-x: hidden; max-width: 100vw; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-variant-numeric: tabular-nums;
        }

        /* ---- HEADER ---- */
        header {
            padding: 48px 14px 0;
            background: var(--header-bg);
            border-bottom: 1px solid var(--divider);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            min-width: 0;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            flex-shrink: 0;
            display: block;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .brand-mark:active { transform: scale(0.9); }

        .header-actions { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; min-width: 0; }

        /* Inline search (compact, right side of header) */
        .search-inline { display: flex; gap: 0; flex: 1; max-width: 240px; min-width: 60px; position: relative; }
        .search-inline input {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.88rem;
            font-weight: 600;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-right: none;
            color: var(--text-main);
            border-radius: 10px 0 0 10px;
            text-transform: uppercase;
            min-width: 0;
        }
        .search-inline input::placeholder { font-weight: 400; text-transform: none; color: var(--text-sub); font-size: 0.8rem; }
        .search-inline input:focus { border-color: var(--accent); background: var(--hover-bg); }

        .ticker-search-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0; right: 0;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            max-height: 280px;
            overflow-y: auto;
            z-index: 120;
        }
        .ticker-search-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 9px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--divider);
        }
        .ticker-search-item:last-child { border-bottom: none; }
        .ticker-search-item:active { background: var(--hover-bg); }
        .ticker-search-symbol { font-weight: 800; font-size: 0.88rem; color: var(--text-main); }
        .ticker-search-name { font-size: 0.74rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ticker-search-empty { padding: 10px 12px; font-size: 0.78rem; color: var(--text-sub); }
        .search-inline button {
            padding: 0 12px;
            font-size: 1.1rem;
            font-weight: 700;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Icon pill buttons */
        .icon-pill {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            padding: 6px 9px;
            line-height: 1;
            flex-shrink: 0;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Very narrow phones (<=380px): trim further so nothing ever has to fight for space */
        @media (max-width: 380px) {
            .search-inline { max-width: 170px; }
            .icon-pill { padding: 6px 7px; min-width: 40px; min-height: 40px; }
        }

        /* Sync drawer */
        .sync-drawer { padding-bottom: 8px; }
        .sync-row { display: flex; gap: 6px; align-items: center; }
        .sync-row input {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            border-radius: 10px;
            letter-spacing: 3px;
        }
        .sync-row input::placeholder { letter-spacing: 0; font-size: 0.78rem; color: var(--text-sub); }
        .sync-row button {
            padding: 8px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            background: var(--input-bg);
            color: var(--text-mid);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            cursor: pointer;
        }
        .sync-row button.primary { background: var(--accent); color: white; border-color: transparent; }
        .sync-status { font-size: 0.7rem; color: var(--text-sub); min-height: 12px; margin-top: 3px; }

        .sync-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 10px;
            margin-top: 8px;
            cursor: pointer;
        }
        .sync-badge.unsynced { background: var(--hold-dim); color: var(--hold-color); }
        .sync-badge.partial { background: var(--accent-dim); color: var(--accent); }
        .sync-badge.synced { background: var(--buy-dim); color: var(--buy-color); cursor: default; }
        .sync-status.error { color: var(--sell-color); }
        .sync-status.ok { color: var(--buy-color); }

        /* Tabs */
        /* Bottom nav (replaces old top tab-row — puts navigation in thumb reach) */
        .bottom-nav {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            display: flex;
            background: var(--header-bg);
            border-top: 1px solid var(--divider);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            z-index: 100;
        }
        .bottom-nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: none;
            padding: 7px 4px 6px;
            min-height: 54px;
            color: var(--text-sub);
            cursor: pointer;
            transition: color 0.15s;
        }
        .bottom-nav-icon { font-size: 1.28rem; line-height: 1; position: relative; display: inline-block; }
        .nav-badge {
            position: absolute;
            top: -4px;
            right: -10px;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            border-radius: 9px;
            background: var(--sell-color);
            color: #fff;
            font-size: 0.62rem;
            font-weight: 800;
            line-height: 17px;
            text-align: center;
        }
        .bottom-nav-label { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.2px; }
        .bottom-nav-btn.active { color: var(--accent); }
        .bottom-nav-btn:active { background: var(--hover-bg); }

        /* Pull-to-refresh indicator — one shared element, JS positions it just below the header */
        .pull-refresh-indicator {
            position: fixed;
            left: 0; right: 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            color: var(--text-sub);
            font-size: 0.78rem;
            font-weight: 700;
            z-index: 95;
            transform: translateY(-40px);
        }
        .pull-refresh-spinner { display: inline-block; font-size: 1rem; transition: transform 0.15s; }
        .pull-refresh-indicator.ready .pull-refresh-spinner { transform: rotate(180deg); }
        .pull-refresh-indicator.refreshing .pull-refresh-spinner { animation: prSpin 0.7s linear infinite; }
        @keyframes prSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* List switcher — horizontal scrollable chips for multiple named watchlists */
        .list-switcher {
            display: none; /* flex when shown via switchTab/JS */
            gap: 6px;
            padding: 8px 12px 0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .list-switcher::-webkit-scrollbar { display: none; }
        .list-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            padding: 7px 12px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
        }
        .list-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
        .list-chip-count { font-size: 0.7rem; font-weight: 600; opacity: 0.7; }
        .list-chip-edit {
            margin-left: 2px;
            font-size: 0.68rem;
            padding: 2px 3px;
            opacity: 0.7;
        }
        .list-chip-del {
            margin-left: 2px;
            font-size: 0.72rem;
            color: var(--text-sub);
            padding: 2px 4px;
        }
        .list-chip-add {
            flex-shrink: 0;
            background: none;
            border: 1px dashed var(--input-border);
            border-radius: 20px;
            padding: 7px 12px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
        }
        .reorder-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 4px 4px 4px 10px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--accent);
        }
        .chip-move {
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
            cursor: pointer;
        }
        .chip-move:disabled { opacity: 0.3; cursor: default; }

        /* Sort control */
        .sort-bar { display: none; padding: 6px 12px 0; }
        .sort-select {
            width: 100%;
            padding: 7px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text-main);
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            align-items: center;
            padding: 8px 12px 4px;
            background: var(--bg-base);
            position: sticky;
            top: var(--header-height, 110px);
            z-index: 90;
        }
        .filter-bar input {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.88rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-right: none;
            color: var(--text-main);
            border-radius: 10px 0 0 10px;
            outline: none;
            text-transform: uppercase;
        }
        .filter-bar input::placeholder { text-transform: none; color: var(--text-sub); }
        .filter-bar input:focus { border-color: var(--accent); }
        .filter-clear {
            padding: 8px 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-left: none;
            border-radius: 0 10px 10px 0;
            color: var(--text-sub);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .filter-clear:hover { color: var(--sell-color); }
        .filter-no-results {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.88rem;
            padding: 24px;
        }

        /* ---- MAIN ---- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px calc(110px + env(safe-area-inset-bottom, 0px));
            overscroll-behavior-y: contain; /* stop the browser's own pull-to-refresh from fighting ours */
            position: relative;
        }

        /* ---- CARD ---- */
        .stock-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            margin-bottom: 10px;
            overflow: hidden;
            position: relative;
        }

        .stock-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 16px 0 0 16px;
            z-index: 3; /* above .stock-card-fg (2) and .swipe-delete-bg (1) — stays visible mid-swipe */
        }
        .stock-card.sig-buy::before { background: var(--buy-color); }
        .stock-card.sig-sell::before { background: var(--sell-color); }
        .stock-card.sig-hold::before { background: var(--hold-color); }

        /* Swipe-to-delete: red action layer sits behind the card's normal content, revealed
           by dragging .stock-card-fg leftward. Width here must match REVEAL_WIDTH in JS. */
        .swipe-delete-bg {
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 90px;
            background: var(--sell-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            z-index: 1;
        }
        .swipe-delete-bg span:first-child { font-size: 1.1rem; }
        .stock-card-fg {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
        }

        .card-inner { padding: 10px 10px 0 14px; }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-left { display: flex; align-items: center; gap: 10px; }
        .card-right { display: flex; align-items: center; gap: 8px; }

        .ticker {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.2px;
            line-height: 1;
        }
        .company-meta { font-size: 0.68rem; color: var(--text-sub); }

        .price-block { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
        .price-ext {
            font-size: 0.68rem;
            font-weight: 700;
            opacity: 0.9;
            white-space: nowrap;
        }
        .price {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.4px;
            line-height: 1;
        }
        .price-change {
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.2px;
        }

        /* Badge */
        .badge {
            padding: 2px 7px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge.buy { background: var(--buy-dim); color: var(--buy-color); }
        .badge.sell { background: var(--sell-dim); color: var(--sell-color); }
        .badge.hold { background: var(--hold-dim); color: var(--hold-color); }

        /* Signal panel — compact, collapsible reasons */
        .signal-panel {
            background: var(--input-bg);
            border-radius: 10px;
            padding: 8px 10px;
            margin: 8px 10px 0 14px;
            cursor: pointer;
        }
        .signal-header { display: flex; align-items: center; gap: 8px; }
        .confidence-bar-wrap { flex: 1; height: 3px; background: var(--divider); border-radius: 4px; overflow: hidden; }
        .confidence-bar { display: block; height: 100%; border-radius: 4px; }
        .confidence-label { font-size: 0.65rem; color: var(--text-sub); white-space: nowrap; font-weight: 600; }
        .signal-reasons {
            margin: 6px 0 0;
            padding-left: 14px;
            font-size: 0.73rem;
            color: var(--text-sub);
            line-height: 1.6;
            display: none; /* collapsed by default */
        }
        .signal-panel.expanded .signal-reasons { display: block; }
        .signal-expand-hint { font-size: 0.62rem; color: var(--text-sub); margin-left: auto; flex-shrink: 0; }
        .signal-levels {
            display: flex; gap: 10px; flex-wrap: wrap;
            margin-top: 6px; padding-top: 6px;
            border-top: 1px solid var(--divider);
            font-size: 0.7rem; color: var(--text-sub);
            display: none;
        }
        .signal-panel.expanded .signal-levels { display: flex; }
        .signal-levels strong { color: var(--text-main); font-weight: 700; }

        /* Action bar — icon only, compact */
        .actions {
            display: flex;
            border-top: 1px solid var(--divider);
            margin: 8px 0 0;
        }
        .icon-btn {
            flex: 1;
            background: transparent;
            border: none;
            border-right: 1px solid var(--divider);
            color: var(--text-sub);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 8px 4px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .icon-btn:last-child { border-right: none; }
        .icon-btn.active { color: var(--accent); background: var(--accent-dim); }
        .icon-btn:active { background: var(--hover-bg); }

        /* Panels */
        .panel { display: none; padding: 12px 14px 14px 18px; border-top: 1px solid var(--divider); }
        .panel.active { display: block; }

        /* Chart */
        .canvas-wrapper { height: 280px; width: 100%; }
        .indicator-toggles {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .indicator-toggles::-webkit-scrollbar { display: none; }
        .ind-btn {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-sub);
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 0.73rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.2px;
            transition: all 0.15s;
        }
        .ind-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        /* Visual separator in indicator row (before oscillators) */
        .ind-sep { width: 1px; background: var(--divider); margin: 2px 4px; flex-shrink: 0; align-self: stretch; }

        /* Zoom controls */
        .zoom-row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
        .zoom-btn {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 12px;
            cursor: pointer;
            line-height: 1.4;
        }
        .zoom-btn:active { background: var(--hover-bg); }

        /* Timeframe selector */
        .tf-row {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }
        .tf-btn {
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-sub);
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        .tf-btn.active {
            background: var(--accent);
            color: white;
            border-color: transparent;
        }

        /* Crosshair tooltip */
        .crosshair-tooltip {
            font-size: 0.74rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            line-height: 1.4;
        }
        .xhair-item { display: flex; align-items: center; gap: 4px; }
        .xhair-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .xhair-name { color: var(--text-sub); font-weight: 600; }
        .xhair-val { color: var(--text-main); font-weight: 700; }
        .chart-legend-values {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--divider);
        }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.74rem; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .legend-name { color: var(--text-sub); font-weight: 600; }
        .legend-value { color: var(--text-main); font-weight: 700; }

        /* News */
        .news-item { padding: 10px 0; border-bottom: 1px solid var(--divider); }
        .news-item:last-child { border-bottom: none; }
        .news-item a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .news-date { font-size: 0.7rem; color: var(--text-sub); }

        /* Alerts */
        .alert-presets { display: flex; gap: 6px; flex-wrap: wrap; }
        .preset-btn {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }
        .preset-btn:active { background: var(--accent-dim); border-color: var(--accent); }
        .alert-form { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

        /* Alerts Tab (multi-select watchlist view) */
        .alerts-subview-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 14px 0;
        }
        .subview-tab {
            flex: 1;
            padding: 8px 0;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
        }
        .subview-tab.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

        .history-list { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 12px;
        }
        .history-item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
        .history-item-ticker { font-weight: 800; font-size: 0.85rem; }
        .history-item-msg { font-size: 0.78rem; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-item-time { font-size: 0.7rem; color: var(--text-sub); flex-shrink: 0; white-space: nowrap; }

        .alerts-tab-header {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin: 12px 14px;
        }
        .alerts-select-row { display: flex; align-items: center; gap: 8px; }
        .alerts-select-count { font-size: 0.78rem; color: var(--text-sub); margin-left: auto; font-weight: 600; }
        .alerts-ticker-list { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
        .alert-ticker-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 12px;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
        }
        .alert-ticker-row:active { background: var(--hover-bg); }
        .alert-ticker-row.selected {
            border-color: var(--accent);
            background: var(--accent-dim);
        }
        .alert-ticker-label { display: flex; align-items: center; gap: 8px; }
        .alert-ticker-check { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--accent); }
        .alert-ticker-name { font-weight: 800; font-size: 0.95rem; }
        .alert-ticker-meta { font-size: 0.78rem; color: var(--text-sub); margin-left: auto; }
        .alert-ticker-rules { margin-top: 8px; padding-left: 26px; display: flex; flex-direction: column; gap: 4px; cursor: default; }
        .alert-ticker-empty { font-size: 0.76rem; color: var(--text-sub); padding-left: 26px; }

        /* Sticky bulk-action bar — floats above the bottom nav, only shown while 1+ tickers are selected */
        /* First-run tips banner */
        .first-run-tip {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 10px 12px 0;
            padding: 11px 12px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 12px;
        }
        .first-run-tip-body { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .first-run-tip-body strong { font-size: 0.82rem; color: var(--accent); }
        .first-run-tip-body span { font-size: 0.75rem; color: var(--text-sub); line-height: 1.45; }
        .first-run-tip-link {
            align-self: flex-start;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.76rem;
            font-weight: 800;
            cursor: pointer;
            padding: 2px 0;
        }
        .first-run-tip-close {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 2px 4px;
            flex-shrink: 0;
        }

        /* Undo snackbar — replaces blocking confirm() dialogs for destructive actions */
        .snackbar {
            position: fixed;
            left: 12px; right: 12px;
            bottom: calc(66px + env(safe-area-inset-bottom, 0px));
            background: var(--text-main);
            color: var(--bg-base);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            z-index: 200;
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }
        .snackbar.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .snackbar-msg { flex: 1; font-size: 0.84rem; font-weight: 600; }
        .snackbar-action {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.84rem;
            font-weight: 800;
            cursor: pointer;
            padding: 4px 6px;
            flex-shrink: 0;
        }

        .bulk-alert-bar {
            position: fixed;
            left: 0; right: 0;
            bottom: calc(54px + env(safe-area-inset-bottom, 0px));
            background: var(--card-bg);
            border-top: 1px solid var(--accent);
            box-shadow: 0 -4px 16px rgba(0,0,0,0.25);
            padding: 10px 14px;
            z-index: 98;
        }
        .bulk-alert-bar-header { display: flex; align-items: center; margin-bottom: 8px; }
        .bulk-alert-bar-header span { font-weight: 800; font-size: 0.88rem; color: var(--accent); }
        .bulk-clear-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 6px;
        }
        .alert-form select, .alert-form input {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 0.82rem;
        }
        .alert-form input { flex: 1; min-width: 80px; }
        .alert-form button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.82rem;
        }
        .active-alert {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            font-size: 0.82rem;
            border-left: 3px solid var(--accent);
        }
        .del-alert { background: transparent; color: var(--sell-color); border: none; cursor: pointer; font-weight: 700; }

        /* Signal panel */
        .signal-panel {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 12px 14px;
            margin: 10px 14px 10px 18px;
        }
        .signal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .confidence-bar-wrap {
            flex: 1;
            height: 4px;
            background: var(--divider);
            border-radius: 4px;
            overflow: hidden;
        }
        .confidence-bar { display: block; height: 100%; border-radius: 4px; transition: width 0.4s ease; }
        .confidence-label { font-size: 0.7rem; color: var(--text-sub); white-space: nowrap; font-weight: 600; }
        .signal-reasons { margin: 0; padding-left: 16px; font-size: 0.77rem; color: var(--text-sub); line-height: 1.7; }
        .signal-levels {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--divider);
            font-size: 0.75rem;
            color: var(--text-sub);
        }
        .signal-levels strong { color: var(--text-main); font-weight: 700; }

        /* Info / error cards */
        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            margin-bottom: 12px;
            padding: 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.88rem;
        }
        .info-card.error-card { border-color: var(--sell-color); color: var(--sell-color); }
        .retry-btn {
            margin-top: 10px;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            padding: 7px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Guide */
        .guide-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            margin-bottom: 10px;
            padding: 16px;
        }
        .guide-section h3 { margin: 0 0 6px; font-size: 0.95rem; font-weight: 700; letter-spacing: -0.2px; }
        .guide-section p { margin: 0 0 8px; font-size: 0.82rem; color: var(--text-sub); line-height: 1.55; }
        .guide-section p:last-child { margin-bottom: 0; }
        .guide-formula {
            font-family: "SF Mono", "Fira Code", Menlo, monospace;
            font-size: 0.72rem;
            background: var(--input-bg);
            padding: 10px 12px;
            border-radius: 10px;
            display: block;
            margin: 8px 0;
            color: var(--accent);
            overflow-x: auto;
            white-space: pre;
            border-left: 2px solid var(--accent);
        }
        .guide-section ul { margin: 6px 0; padding-left: 18px; font-size: 0.82rem; color: var(--text-sub); line-height: 1.65; }
        .guide-section li strong { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <!-- Row 1: Brand mark + search + controls -->
        <div class="header-top">
            <img class="brand-mark" src="./icons/icon-192.png" alt="Stockz Tracker" title="Home" width="32" height="32" onclick="goHome()">
            <div class="header-actions">
                <div class="search-inline">
                    <input type="text" id="tickerInput" placeholder="Ticker or company…" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" oninput="onTickerInputChange(this.value)">
                    <button onclick="addStock()">+</button>
                    <div class="ticker-search-dropdown" id="tickerSearchDropdown" style="display:none;"></div>
                </div>
                <button class="icon-pill" onclick="toggleSyncDrawer()" id="syncIcon" title="Cloud Sync">☁️</button>
                <button class="icon-pill" onclick="toggleTheme()" id="themeIcon">🌙</button>
            </div>
        </div>

        <!-- Sync drawer: hidden by default, slides in when ☁ tapped -->
        <div class="sync-drawer" id="syncDrawer" style="display:none;">
            <div class="sync-row">
                <input type="text" id="pinInput" placeholder="PIN (4–12 digits)" inputmode="numeric" maxlength="12">
                <button onclick="loadFromPin()">Load</button>
                <button class="primary" onclick="saveToPin()">Save</button>
            </div>
            <div class="sync-status" id="syncStatus"></div>
            <div class="sync-row" style="margin-top:6px;">
                <button style="flex:1;" id="pushBtn" onclick="enablePushAlerts()">🔔 Enable Watch Alerts</button>
            </div>
            <div class="sync-status" id="pushStatus"></div>
            <div class="sync-row" id="installRow" style="margin-top:6px; display:none;">
                <button style="flex:1;" id="installBtn" onclick="installApp()">📲 Install App</button>
            </div>
            <div class="sync-status" id="installStatus"></div>
            <div class="sync-badge-slot" id="syncBadgeDrawer"></div>
        </div>
    </header>

    <!-- Pull-to-refresh indicator — JS positions it just below the header and animates it during a pull -->
    <div class="pull-refresh-indicator" id="pullRefreshIndicator">
        <span class="pull-refresh-spinner">↓</span>
        <span class="pull-refresh-text">Pull to refresh</span>
    </div>

    <div class="list-switcher" id="listSwitcher"></div>

    <div class="first-run-tip" id="firstRunTip" style="display:none;">
        <div class="first-run-tip-body">
            <strong>👋 Quick tips</strong>
            <span>Tap a card to expand it · swipe left to remove · drag charts to pan · the Alerts tab does bulk alerts.</span>
            <button class="first-run-tip-link" onclick="switchTab('guide')">See all tips →</button>
        </div>
        <button class="first-run-tip-close" onclick="dismissFirstRunTip()">✕</button>
    </div>

    <div class="first-run-tip" id="installBanner" style="display:none;">
        <div class="first-run-tip-body">
            <strong>📲 Install Stockz Tracker</strong>
            <span>Add it to your home screen for fullscreen access and alerts that reach your phone.</span>
            <button class="first-run-tip-link" onclick="installApp()">Install now →</button>
        </div>
        <button class="first-run-tip-close" onclick="dismissInstallBanner()">✕</button>
    </div>

    <div class="sort-bar" id="sortBarPortfolio"></div>

    <div class="filter-bar" id="filterBar">
        <input type="text" id="filterInput" placeholder="🔍  Filter stocks…" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" oninput="filterWatchlist(this.value)">
        <button class="filter-clear" id="filterClear" onclick="clearFilter()" style="display:none;">✕</button>
    </div>

    <main id="watchlist">
        <div class="info-card">Initializing Data...</div>
    </main>

    <main id="alertsView" style="display:none; padding-bottom: 260px;"></main>

    <main id="guideView" style="display:none;"></main>

    <!-- Bottom nav — moved from the top header so navigation sits in thumb reach -->
    <!-- Bulk alert action bar — appears above the bottom nav once 1+ stocks are selected on the Alerts tab -->
    <div class="bulk-alert-bar" id="bulkAlertBar" style="display:none;">
        <div class="bulk-alert-bar-header">
            <span id="bulkAlertCount">0 selected</span>
            <button class="bulk-clear-btn" onclick="selectAllAlertTickers(false)">Clear ✕</button>
        </div>
        <div class="alert-presets">
            <button class="preset-btn" onclick="addPresetAlertToSelected('price_drop_pct',5)">🔻 -5%</button>
            <button class="preset-btn" onclick="addPresetAlertToSelected('price_drop_pct',10)">🔻 -10%</button>
            <button class="preset-btn" onclick="addPresetAlertToSelected('price_drop_pct',15)">🔻 -15%</button>
            <button class="preset-btn" onclick="addPresetAlertToSelected('rsi_below',30)">RSI &lt; 30</button>
            <button class="preset-btn" onclick="addPresetAlertToSelected('rsi_above',70)">RSI &gt; 70</button>
            <button class="preset-btn" onclick="toggleBulkCustomForm()">⚙️ Custom</button>
        </div>
        <div class="alert-form" id="bulkCustomForm" style="display:none;">
            <select id="alertsTab-type">
                <option value="price_drop_pct">Price drops %</option>
                <option value="price_rise_pct">Price rises %</option>
                <option value="rsi_below">RSI below</option>
                <option value="rsi_above">RSI above</option>
                <option value="price_above">Price above $</option>
                <option value="price_below">Price below $</option>
                <option value="sma_above">SMA50 above $</option>
                <option value="sma_below">SMA50 below $</option>
            </select>
            <input type="number" id="alertsTab-val" placeholder="Value">
            <button onclick="addCustomAlertToSelected()">Apply</button>
        </div>
        <div class="sync-status" id="alertsTabStatus"></div>
    </div>

    <div class="snackbar" id="snackbar">
        <span class="snackbar-msg" id="snackbarMsg"></span>
        <button class="snackbar-action" id="snackbarAction">Undo</button>
    </div>

    <nav class="bottom-nav" id="bottomNav">
        <button class="bottom-nav-btn active" id="tab-portfolio" onclick="switchTab('portfolio')">
            <span class="bottom-nav-icon">📊</span>
            <span class="bottom-nav-label">Portfolio</span>
        </button>
        <button class="bottom-nav-btn" id="tab-alerts" onclick="switchTab('alerts')">
            <span class="bottom-nav-icon">🔔<span class="nav-badge" id="alertsNavBadge" style="display:none;">0</span></span>
            <span class="bottom-nav-label">Alerts</span>
        </button>
        <button class="bottom-nav-btn" id="tab-guide" onclick="switchTab('guide')">
            <span class="bottom-nav-icon">📖</span>
            <span class="bottom-nav-label">Guide</span>
        </button>
    </nav>

    <script>
        // --- Theme Management ---
        function applyTheme(mode) {
            if (mode === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeIcon').innerText = '☀️';
                document.getElementById('theme-meta').setAttribute('content', '#f2f2f7');
            } else {
                document.body.classList.remove('light-mode');
                document.getElementById('themeIcon').innerText = '🌙';
                document.getElementById('theme-meta').setAttribute('content', '#000000');
            }
        }

        function toggleTheme() {
            const isLight = document.body.classList.contains('light-mode');
            const newMode = isLight ? 'dark' : 'light';
            localStorage.setItem('theme', newMode);
            applyTheme(newMode);
            renderUI();
        }

        function toggleSyncDrawer() {
            const drawer = document.getElementById('syncDrawer');
            const icon = document.getElementById('syncIcon');
            const isOpen = drawer.style.display !== 'none';
            drawer.style.display = isOpen ? 'none' : 'block';
            icon.style.background = isOpen ? '' : 'var(--accent)';
            icon.style.color = isOpen ? '' : 'white';
            icon.style.borderColor = isOpen ? '' : 'transparent';
            if (!isOpen) {
                // Pre-fill PIN if we have one saved
                document.getElementById('pinInput').value = appState.pin;
            }
        }

        // --- Tab Switching ---
        // Tapping the header brand mark acts like a "home" button: back to Portfolio,
        // any active filter cleared, scrolled to the top of the list.
        function goHome() {
            switchTab('portfolio');
            clearFilter();
            const list = document.getElementById('watchlist');
            if (list) list.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function dismissFirstRunTip() {
            localStorage.setItem('tipsDismissed', '1');
            const el = document.getElementById('firstRunTip');
            if (el) el.style.display = 'none';
        }

        function switchTab(tab) {
            const portfolio = document.getElementById('watchlist');
            const guide = document.getElementById('guideView');
            const alertsTab = document.getElementById('alertsView');
            const tabPortfolio = document.getElementById('tab-portfolio');
            const tabGuide = document.getElementById('tab-guide');
            const tabAlerts = document.getElementById('tab-alerts');
            const filterBar = document.getElementById('filterBar');
            const sortBarPortfolio = document.getElementById('sortBarPortfolio');
            const listSwitcher = document.getElementById('listSwitcher');

            appState.ui.activeTab = tab;

            portfolio.style.display = tab === 'portfolio' ? '' : 'none';
            guide.style.display = tab === 'guide' ? 'block' : 'none';
            alertsTab.style.display = tab === 'alerts' ? 'block' : 'none';
            const showChrome = tab === 'portfolio' || tab === 'alerts'; // both operate on the active list
            if (filterBar) filterBar.style.display = tab === 'portfolio' ? 'flex' : 'none';
            if (sortBarPortfolio) sortBarPortfolio.style.display = tab === 'portfolio' ? 'block' : 'none';
            const tipEl = document.getElementById('firstRunTip');
            if (tipEl && !localStorage.getItem('tipsDismissed')) tipEl.style.display = tab === 'portfolio' ? 'flex' : 'none';
            refreshInstallUI();
            if (listSwitcher) listSwitcher.style.display = showChrome ? 'flex' : 'none';

            tabPortfolio.classList.toggle('active', tab === 'portfolio');
            tabGuide.classList.toggle('active', tab === 'guide');
            tabAlerts.classList.toggle('active', tab === 'alerts');

            if (tab === 'guide' && !guide.dataset.rendered) {
                guide.innerHTML = getGuideHTML();
                guide.dataset.rendered = '1';
            }
            if (tab === 'alerts') {
                renderAlertsTab(); // also updates the bulk-action bar
            } else {
                updateBulkAlertBar(); // hides it — activeTab is no longer 'alerts'
            }
        }

        // ============================================================
        // Multi-watchlist management — create, switch, delete, rename, reorder
        // ============================================================
        function renderListSwitcher() {
            const container = document.getElementById('listSwitcher');
            if (!container) return;
            const names = Object.keys(appState.watchlists);
            const reordering = !!appState.ui.reorderingLists;

            const chips = names.map((name, i) => {
                const esc = name.replace(/'/g, "\\'");
                const safeName = escapeHtml(name);
                if (reordering) {
                    return `
                        <span class="list-chip reorder-chip">
                            <button class="chip-move" ${i === 0 ? 'disabled' : ''} onclick="moveList('${esc}', -1)">‹</button>
                            <span class="list-chip-label">${safeName}</span>
                            <button class="chip-move" ${i === names.length - 1 ? 'disabled' : ''} onclick="moveList('${esc}', 1)">›</button>
                        </span>`;
                }
                const isActive = name === appState.activeList;
                const count = appState.watchlists[name].length;
                return `
                    <button class="list-chip${isActive ? ' active' : ''}" onclick="switchList('${esc}')">
                        ${safeName} <span class="list-chip-count">${count}</span>
                        <span class="list-chip-edit" onclick="event.stopPropagation();renameList('${esc}')">✏️</span>
                        ${names.length > 1 ? `<span class="list-chip-del" onclick="event.stopPropagation();deleteList('${esc}')">✕</span>` : ''}
                    </button>`;
            }).join('');

            const trailingBtn = reordering
                ? `<button class="list-chip-add" onclick="toggleReorderMode()">✓ Done</button>`
                : `<button class="list-chip-add" onclick="promptNewList()">+ New List</button>

        function toggleReorderMode() {

        // Swaps a list's position with its neighbor. Reordering is done by rebuilding the
        // watchlists object with keys re-inserted in the new order — JS objects (and JSON
        // round-trips through the worker/KV) preserve string-key insertion order, so this is
        // enough; no separate order array needed.
        function moveList(name, direction) {
            const names = Object.keys(appState.watchlists);
            const idx = names.indexOf(name);
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= names.length) return;
            [names[idx], names[newIdx]] = [names[newIdx], names[idx]];
            const reordered = {};
            names.forEach(n => { reordered[n] = appState.watchlists[n]; });
            appState.watchlists = reordered;
            saveWatchlistsLocal();
            persistWatchlist();
            renderListSwitcher();
        }

        function renameList(oldName) {
            const newName = (prompt('Rename list:', oldName) || '').trim();
            if (!newName || newName === oldName) return;
            if (newName.length > 30) { alert('List name is too long (max 30 characters)'); return; }
            if (appState.watchlists[newName]) { alert(`A list named "${newName}" already exists`); return; }

            // Rebuild preserving position — a plain delete+re-add would move the key to the end.
            const reordered = {};
            Object.keys(appState.watchlists).forEach(n => {
                reordered[n === oldName ? newName : n] = appState.watchlists[n];
            });
            appState.watchlists = reordered;
            if (appState.activeList === oldName) appState.activeList = newName;
            saveWatchlistsLocal();
            persistWatchlist();
            renderListSwitcher();
            if (appState.ui.activeTab === 'alerts') renderAlertsTab();
        }

            appState.activeList = name;

            renderListSwitcher();
            document.getElementById('watchlist').innerHTML = '<div class="info-card">Fetching...</div>';
            updateData(); // fetches any tickers in this list not already cached, then renders
            if (appState.ui.activeTab === 'alerts') renderAlertsTab();
        }

        function promptNewList() {
            const name = (prompt('Name for the new watchlist:') || '').trim();
            if (!name) return;
            if (name.length > 30) { alert('List name is too long (max 30 characters)'); return; }
            if (appState.watchlists[name]) { alert(`A list named "${name}" already exists`); switchList(name); return; }

            appState.watchlists[name] = [];
            appState.activeList = name;
            saveWatchlistsLocal();
            persistWatchlist(); // also syncs to cloud if a PIN is set
            renderListSwitcher();
            renderUI();
        }

        function deleteList(name) {
            const names = Object.keys(appState.watchlists);
            if (names.length <= 1) { alert("Can't delete your only watchlist"); return; }

            // Snapshot enough to fully restore: the tickers, the list's position in the chip
            // order, which list was active, and any alert rules about to be purged as orphans.
            const tickersInList = appState.watchlists[name].slice();
            const originalIndex = names.indexOf(name);
            const previousActive = appState.activeList;
            const alertsSnapshot = {};
            tickersInList.forEach(t => {
                if (appState.alerts[t]) alertsSnapshot[t] = JSON.parse(JSON.stringify(appState.alerts[t]));
            });

            delete appState.watchlists[name];
            if (appState.activeList === name) {
                appState.activeList = Object.keys(appState.watchlists)[0];
            }
            tickersInList.forEach(purgeOrphanedTickerState);
            saveWatchlistsLocal();
            persistWatchlist();
            renderListSwitcher();
            document.getElementById('watchlist').innerHTML = '<div class="info-card">Fetching...</div>';
            updateData();
            if (appState.ui.activeTab === 'alerts') renderAlertsTab();

            const count = tickersInList.length;
            showUndoSnackbar(`Deleted "${name}"${count ? ` (${count} ticker${count === 1 ? '' : 's'})` : ''}`, () => {
                // Rebuild with the list re-inserted at its original position, since object key
                // order drives chip order — a plain re-add would send it to the end.
                const rebuilt = {};
                const currentNames = Object.keys(appState.watchlists);
                const insertAt = Math.min(originalIndex, currentNames.length);
                currentNames.slice(0, insertAt).forEach(n => { rebuilt[n] = appState.watchlists[n]; });
                rebuilt[name] = tickersInList;
                currentNames.slice(insertAt).forEach(n => { rebuilt[n] = appState.watchlists[n]; });
                appState.watchlists = rebuilt;
                appState.activeList = previousActive;

                Object.keys(alertsSnapshot).forEach(t => { appState.alerts[t] = alertsSnapshot[t]; });
                if (Object.keys(alertsSnapshot).length) {
                    localStorage.setItem('alerts', JSON.stringify(appState.alerts));
                    syncAlertsToServer();
                }
                saveWatchlistsLocal();
                persistWatchlist();
                renderListSwitcher();
                updateData();
                if (appState.ui.activeTab === 'alerts') renderAlertsTab();
            });
        }

        // True if `ticker` still appears in at least one watchlist (any list, not just the active one).
        function tickerExistsInAnyList(ticker) {
            return Object.values(appState.watchlists).some(list => list.includes(ticker));
        }

        // Cleans up ALL per-ticker state once a ticker no longer belongs to any watchlist —
        // cached price data, UI panel toggles, indicator settings, and critically, its alert
        // rules. Without this, a removed ticker's alerts kept living in appState.alerts and
        // stayed synced to the server, where the Cron Trigger would keep evaluating and firing
        // push notifications for them forever, with no way to see or delete them from the UI
        // (the Alerts tab only ever lists tickers from your current watchlists).
        function purgeOrphanedTickerState(ticker) {
            if (tickerExistsInAnyList(ticker)) return; // still referenced elsewhere — keep its state

            Object.keys(CONFIG.TIMEFRAMES).forEach(tf => { delete appState.dataCache[getTfKey(ticker, tf)]; });
            delete appState.errors[ticker];
            delete appState.timeframe[ticker];
            delete appState.indicators[ticker];
            delete appState.ui.charts[ticker];
            delete appState.ui.news[ticker];
            delete appState.ui.alerts[ticker];
            delete appState.ui.cardExpanded[ticker];

            if (appState.alerts[ticker]) {
                delete appState.alerts[ticker];
                localStorage.setItem('alerts', JSON.stringify(appState.alerts));
                syncAlertsToServer(); // removes these rules server-side too, so the cron stops evaluating them
            }
        }

        // Returns today's % change for a ticker from cached price data, or null if not yet
        // loaded / not enough history — used only for sorting, never shown as a value itself.
        function todaysChangePct(ticker) {
            const data = getTickerData(ticker);
            if (!data || !Array.isArray(data.prices) || data.prices.length < 2) return null;
            const prices = data.prices;
            const current = prices[prices.length - 1];
            const prev = prices[prices.length - 2];
            if (!prev) return null;
            return ((current - prev) / prev) * 100;
        }

            if (mode === 'manual') return list;

            if (mode === 'name-asc') return list.sort((a, b) => a.localeCompare(b));
            if (mode === 'name-desc') return list.sort((a, b) => b.localeCompare(a));

            if (mode === 'change-desc' || mode === 'change-asc') {
                const withPct = list.map(t => ({ t, pct: todaysChangePct(t) }));

                    if (a.pct === null && b.pct === null) return 0;

                    return mode === 'change-desc' ? b.pct - a.pct : a.pct - b.pct;

            return list;

        // --- Math & Indicator Logic ---
        // O(n) sliding-window SMA — avoids re-summing the full period on every step.
        function getSMAArray(prices, period = CONFIG.SMA_PERIOD) {
            const result = new Array(prices.length).fill(null);
            let sum = 0;
            for (let i = 0; i < prices.length; i++) {
                sum += prices[i];
                if (i >= period) sum -= prices[i - period];
                if (i >= period - 1) result[i] = sum / period;
            }
            return result;
        }

        // O(n) EMA — already O(n), unchanged.
        function getEMAArray(prices, period) {
            const k = 2 / (period + 1);
            let prev = prices[0];
            return prices.map((p, i) => {
                if (i === 0) { prev = p; return p; }
                prev = (p - prev) * k + prev;
                return prev;
            });
        }

        // O(n) sliding-window Bollinger Bands using Welford's online variance.
        function getBBArray(prices, period = CONFIG.BB_PERIOD, mult = CONFIG.BB_MULT) {
            const upper = new Array(prices.length).fill(null);
            const lower = new Array(prices.length).fill(null);
            let sum = 0, sumSq = 0;
            for (let i = 0; i < prices.length; i++) {
                sum   += prices[i];
                sumSq += prices[i] * prices[i];
                if (i >= period) {
                    sum   -= prices[i - period];
                    sumSq -= prices[i - period] * prices[i - period];
                }
                if (i >= period - 1) {
                    const mean = sum / period;
                    const variance = sumSq / period - mean * mean;
                    const std = Math.sqrt(Math.max(0, variance));
                    upper[i] = mean + mult * std;
                    lower[i] = mean - mult * std;
                }
            }
            return { upper, lower };
        }
        function getRSIArray(prices, period = CONFIG.RSI_PERIOD) { let rsi=[], gains=0, losses=0; for(let i=0; i<prices.length; i++) { if(i<period){rsi.push(null);continue;} if(i===period){for(let j=1;j<=period;j++){let d=prices[j]-prices[j-1]; if(d>0)gains+=d; else losses-=d;} }else{let d=prices[i]-prices[i-1]; gains=((gains*(period-1))+(d>0?d:0))/period; losses=((losses*(period-1))+(d<0?-d:0))/period; } let rs=losses===0?100:gains/losses; rsi.push(100-(100/(1+rs))); } return rsi; }
        function getMACDArray(prices, fast = CONFIG.MACD_FAST, slow = CONFIG.MACD_SLOW, signalPeriod = CONFIG.MACD_SIGNAL) { let emaFast=getEMAArray(prices, fast), emaSlow=getEMAArray(prices, slow), macd=prices.map((_,i)=>i>=slow-1 ? emaFast[i]-emaSlow[i] : null); let validMacd = macd.filter(x=>x!==null); let signalValid = getEMAArray(validMacd, signalPeriod); let signal = Array(macd.length - signalValid.length).fill(null).concat(signalValid); return {macd, signal}; }

        // ADX (Average Directional Index) — Wilder's smoothing. Measures trend STRENGTH (0-100),
        // not direction. >25 = real trend worth trusting, <20 = choppy/range-bound, signals less reliable.
        // Requires OHLC (high/low); returns all-null array if unavailable so callers can degrade gracefully.
        function getADXArray(ohlc, period = 14) {
            const len = ohlc.length;
            const nullArr = () => new Array(len).fill(null);
            if (!ohlc.length || ohlc[0].h === null || ohlc[0].h === undefined) return nullArr();

            const tr = nullArr(), plusDM = nullArr(), minusDM = nullArr();
            for (let i = 1; i < len; i++) {
                if (ohlc[i].h === null || ohlc[i-1].h === null) continue;
                const upMove = ohlc[i].h - ohlc[i-1].h;
                const downMove = ohlc[i-1].l - ohlc[i].l;
                plusDM[i] = (upMove > downMove && upMove > 0) ? upMove : 0;
                minusDM[i] = (downMove > upMove && downMove > 0) ? downMove : 0;
                const prevClose = ohlc[i-1].c;
                tr[i] = Math.max(ohlc[i].h - ohlc[i].l, Math.abs(ohlc[i].h - prevClose), Math.abs(ohlc[i].l - prevClose));
            }

            const smooth = (arr) => {
                const out = nullArr();
                let prev = null;
                for (let i = 0; i < len; i++) {
                    if (arr[i] === null) continue;
                    if (prev === null) {
                        const slice = arr.slice(Math.max(0, i - period + 1), i + 1).filter(x => x !== null);
                        if (slice.length < period) continue;
                        prev = slice.reduce((a,b)=>a+b, 0);
                        out[i] = prev;
                    } else {
                        prev = prev - (prev / period) + arr[i];
                        out[i] = prev;
                    }
                }
                return out;
            };

            const sTR = smooth(tr), sPlusDM = smooth(plusDM), sMinusDM = smooth(minusDM);
            const dx = nullArr();
            for (let i = 0; i < len; i++) {
                if (sTR[i] === null || sTR[i] === 0) continue;
                const plusDI = 100 * sPlusDM[i] / sTR[i];
                const minusDI = 100 * sMinusDM[i] / sTR[i];
                const sum = plusDI + minusDI;
                dx[i] = sum === 0 ? 0 : 100 * Math.abs(plusDI - minusDI) / sum;
            }

            const adx = nullArr();
            let prevAdx = null;
            const dxStart = dx.findIndex(x => x !== null);
            if (dxStart === -1) return adx;
            for (let i = dxStart; i < len; i++) {
                if (dx[i] === null) continue;
                if (prevAdx === null) {
                    if (i < dxStart + period - 1) continue;
                    const slice = dx.slice(dxStart, dxStart + period).filter(x => x !== null);
                    if (!slice.length) continue;
                    prevAdx = slice.reduce((a,b)=>a+b, 0) / slice.length;
                    adx[i] = prevAdx;
                } else {
                    prevAdx = (prevAdx * (period - 1) + dx[i]) / period;
                    adx[i] = prevAdx;
                }
            }
            return adx;
        }

        // Simple signal: RSI + price-vs-SMA50 crossover, confirmed by SMA200 long-term trend
        // and ADX trend strength. No external data dependencies (news/sentiment).
        function getSimpleSignal(prices, computed) {
            const i = prices.length - 1;
            const currentPrice = prices[i];
            const rsi = computed.rsi[i];
            const sma = computed.sma[i];
            const sma200 = computed.sma200 ? computed.sma200[i] : null;
            const adx = computed.adx ? computed.adx[i] : null;
            const reasons = [];
            let signal = 'HOLD';

            if (rsi !== null) {
                if (rsi < 30) reasons.push(`RSI oversold (${rsi.toFixed(1)})`);
                else if (rsi > 70) reasons.push(`RSI overbought (${rsi.toFixed(1)})`);
            }
            if (sma !== null) {
                reasons.push(currentPrice > sma ? `Price above SMA${CONFIG.SMA_PERIOD}` : `Price below SMA${CONFIG.SMA_PERIOD}`);
            }
            if (sma200 !== null) {
                reasons.push(currentPrice > sma200 ? 'Long-term trend (SMA200) bullish' : 'Long-term trend (SMA200) bearish');
            }
            if (adx !== null) {
                reasons.push(adx > 25 ? `Trend confirmed strong (ADX ${adx.toFixed(1)})` : `Trend weak/choppy (ADX ${adx.toFixed(1)}) — signal less reliable`);
            }

            if (rsi !== null && sma !== null) {
                if (rsi < 30 && currentPrice > sma) signal = 'BUY';
                else if (rsi > 70 && currentPrice < sma) signal = 'SELL';
            }

            // Long-term trend confirmation: if SMA200 disagrees with the signal direction, flag it
            // rather than overriding — this keeps the core rule unchanged but adds a visible caveat.
            if (signal === 'BUY' && sma200 !== null && currentPrice < sma200) {
                reasons.push('⚠ Caution: against the long-term (SMA200) downtrend');
            }
            if (signal === 'SELL' && sma200 !== null && currentPrice > sma200) {
                reasons.push('⚠ Caution: against the long-term (SMA200) uptrend');
            }

            return { signal, reasons };
        }

        // Compute and cache all indicator arrays for a ticker's full price history.
        // Avoids recomputing on every render / chart redraw.
        function computeIndicatorSet(prices, ohlc) {
            const set = {
                sma: getSMAArray(prices),
                sma20: getSMAArray(prices, 20),
                sma200: getSMAArray(prices, 200),
                ema20: getEMAArray(prices, 20),
                bb: getBBArray(prices),
                rsi: getRSIArray(prices),
                macd: getMACDArray(prices),
                adx: getADXArray(ohlc || []),
            };
            set.composite = getSimpleSignal(prices, set);
            return set;
        }

        // Returns the cache key for a ticker+timeframe combination
        function getTfKey(ticker, tf) { return ticker + ':' + (tf || CONFIG.DEFAULT_TF); }

        // Gets the active timeframe for a ticker
        function getActiveTf(ticker) { return appState.timeframe[ticker] || CONFIG.DEFAULT_TF; }

        // Gets data for a ticker's current active timeframe
        function getTickerData(ticker) { return appState.dataCache[getTfKey(ticker, getActiveTf(ticker))]; }

        // --- API Data Fetching (via Cloudflare Worker proxy) ---
        async function fetchStockData(ticker, tf) {
            tf = tf || CONFIG.DEFAULT_TF;
            const { interval, range } = CONFIG.TIMEFRAMES[tf] || CONFIG.TIMEFRAMES[CONFIG.DEFAULT_TF];
            const res = await fetch(`${CONFIG.WORKER_BASE}/api/chart?ticker=${encodeURIComponent(ticker)}&range=${range}&interval=${interval}`);
            if (!res.ok) {
                let msg = `HTTP ${res.status}`;
                try { const j = await res.json(); if(j.error) msg = j.error; } catch(e) {}
                throw new Error(msg);
            }
            const data = await res.json();
            if (!data.prices || !data.prices.length) throw new Error('No price data returned');
            return { prices: data.prices, dates: data.dates, ohlc: data.ohlc || [], tf };
        }

        async function fetchNews(ticker) {
            try {
                const res = await fetch(`${CONFIG.WORKER_BASE}/api/news?ticker=${encodeURIComponent(ticker)}`);
                if (!res.ok) return [];
                const data = await res.json();
                return data.news || [];
            } catch(e) { return []; }
        }

        // --- Watchlist Sync (PIN-based, Cloudflare KV) ---
        function setSyncStatus(msg, type) {
            const el = document.getElementById('syncStatus');
            el.textContent = msg;
            el.className = 'sync-status' + (type ? ' ' + type : '');
        }

        // Reflects the real state of alert delivery in plain language — not just "is a PIN set"
        // (which is now always true, auto-generated) but whether it's actually confirmed synced
        // to the cloud AND whether this specific device has push enabled, since both are required
        // for an alert to actually reach you when the app is closed.
        function getSyncBadgeHTML() {
            if (!appState.cloudSynced) {
                return `<div class="sync-badge unsynced" onclick="toggleSyncDrawer()">⚠️ Not yet confirmed synced to cloud — tap ☁️ to retry</div>`;
            }
            if (!appState.pushEnabled) {
                return `<div class="sync-badge partial" onclick="toggleSyncDrawer()">🔔 Cloud sync active — tap ☁️ to enable push on this device</div>`;
            }
            return `<div class="sync-badge synced">✅ Cloud alerts active — will fire even when the app is closed</div>`;
        }

        function refreshSyncBadges() {
            document.querySelectorAll('.sync-badge-slot').forEach(el => { el.innerHTML = getSyncBadgeHTML(); });
        }

        function getPin() {
            const val = document.getElementById('pinInput').value.trim();
            return val;
        }

        async function loadFromPin() {
            const pin = getPin();
            if (!/^[0-9]{4,12}$/.test(pin)) { setSyncStatus('PIN must be 4-12 digits', 'error'); return; }

            setSyncStatus('Loading...', '');
            try {
                const res = await fetch(`${CONFIG.WORKER_BASE}/api/watchlist?pin=${encodeURIComponent(pin)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.watchlists || typeof data.watchlists !== 'object') { setSyncStatus('No saved watchlists found for this PIN', 'error'); return; }

                appState.watchlists = data.watchlists;
                appState.activeList = Object.keys(appState.watchlists)[0] || 'My Watchlist';
                if (!appState.watchlists[appState.activeList]) appState.watchlists[appState.activeList] = [];
                appState.pin = pin;
                saveWatchlistsLocal();
                localStorage.setItem('syncPin', pin);

                setSyncStatus('Loaded watchlists from cloud', 'ok');
                document.getElementById('watchlist').innerHTML = '<div class="info-card">Fetching...</div>';
                renderListSwitcher();
                const [alertsOk] = await Promise.all([loadAlertsFromServer(), loadPrefsFromServer()]);
                appState.cloudSynced = alertsOk;
                refreshSyncBadges();
                await updateData(true);
            } catch(e) {
                setSyncStatus('Failed to load: ' + e.message, 'error');
            }
        }

        async function saveToPin() {
            const pin = getPin();
            if (!/^[0-9]{4,12}$/.test(pin)) { setSyncStatus('PIN must be 4-12 digits', 'error'); return; }

            setSyncStatus('Saving...', '');
            try {
                const res = await fetch(`${CONFIG.WORKER_BASE}/api/watchlist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin, watchlists: appState.watchlists })
                });
                if (!res.ok) {
                    let msg = `HTTP ${res.status}`;
                    try { const j = await res.json(); if(j.error) msg = j.error; } catch(e) {}
                    throw new Error(msg);
                }
                appState.pin = pin;
                localStorage.setItem('syncPin', pin);
                appState.cloudSynced = true;
                refreshSyncBadges();
                setSyncStatus('Saved to cloud', 'ok');
            } catch(e) {
                setSyncStatus('Failed to save: ' + e.message, 'error');
            }
        }

        // Saves all watchlists locally, and to cloud if a PIN is set
        function persistWatchlist() {
            saveWatchlistsLocal();
            if (appState.pin) {
                fetch(`${CONFIG.WORKER_BASE}/api/watchlist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: appState.pin, watchlists: appState.watchlists })
                }).then(res => {
                    appState.cloudSynced = res.ok;
                    if (res.ok) setSyncStatus('Synced', 'ok');
                    else setSyncStatus('Cloud sync failed', 'error');
                    refreshSyncBadges();
                }).catch(() => {
                    appState.cloudSynced = false;
                    setSyncStatus('Cloud sync failed (offline?)', 'error');
                    refreshSyncBadges();
                });
            }
        }

        // --- Core Application Loop ---
        // forceRefresh=true always re-fetches (used by the 60s auto-refresh timer and manual
        // pull-to-refresh, where fresh prices are the whole point). Otherwise, a ticker whose
        // cached data is still under FRESH_MS old is skipped entirely — this matters a lot now
        // that switching between watchlists calls updateData() too: two lists sharing a ticker
        // no longer force a redundant network round-trip just because you switched tabs.
        const FRESH_MS = 30000;
        async function updateData(forceRefresh = false) {
            await Promise.all(activeWatchlist().map(async ticker => {
                ensureTickerState(ticker);
                const tf = getActiveTf(ticker);
                const key = getTfKey(ticker, tf);

                const cached = appState.dataCache[key];
                const isFresh = cached && cached.fetchedAt && (Date.now() - cached.fetchedAt) < FRESH_MS;
                if (!forceRefresh && isFresh) {
                    try { evaluateAlerts(ticker); } catch (e) { console.error(`evaluateAlerts failed for ${ticker}:`, e); }
                    renderUI();
                    return;
                }

                try {
                    const data = await fetchStockData(ticker, tf);
                    if (!Array.isArray(data.prices) || !data.prices.length) {
                        throw new Error('No price data returned');
                    }
                    data.computed = computeIndicatorSet(data.prices, data.ohlc);
                    data.fetchedAt = Date.now();
                    appState.dataCache[key] = data;
                    delete appState.errors[ticker];
                } catch(e) {
                    appState.errors[ticker] = e.message || 'Failed to load';
                    delete appState.dataCache[key];
                }

                try { evaluateAlerts(ticker); } catch(e) { console.error(`evaluateAlerts failed for ${ticker}:`, e); }
                renderUI();
            }));
            localStorage.setItem('indicators', JSON.stringify(appState.indicators));
        }

        // Switch timeframe for a specific ticker — fetches if not cached, otherwise instant
        async function switchTimeframe(ticker, tf) {
            if (!CONFIG.TIMEFRAMES[tf]) return;
            appState.timeframe[ticker] = tf;
            const key = getTfKey(ticker, tf);

            // Update button states immediately
            Object.keys(CONFIG.TIMEFRAMES).forEach(t => {
                const btn = document.getElementById(`tf-${ticker}-${t}`);
                if (btn) btn.classList.toggle('active', t === tf);
            });

            // If already cached for this timeframe, just redraw
            if (appState.dataCache[key]) {
                try { drawChart(ticker); } catch(e) { console.error(e); }
                return;
            }

            // Not cached — fetch, then redraw
            const key2 = getTfKey(ticker, tf);
            try {
                const data = await fetchStockData(ticker, tf);
                data.computed = computeIndicatorSet(data.prices, data.ohlc);
                appState.dataCache[key2] = data;
                delete appState.errors[ticker];
            } catch(e) {
                appState.errors[ticker] = e.message || 'Failed to load';
            }
            renderUI();
        }

        function buildSignalInnerHTML(comp, expanded) {
            const sigClass = comp.signal === 'BUY' ? 'buy' : comp.signal === 'SELL' ? 'sell' : 'hold';
            const hint = expanded ? 'Tap to collapse ‹' : 'Tap for details & actions ›';
            return `
                <div class="signal-header">
                    <span class="badge ${sigClass}">${comp.signal}</span>
                    <span class="signal-expand-hint">${hint}</span>
                </div>
                <ul class="signal-reasons">
