                    ${(comp.reasons || []).map(r => `<li>${r}</li>`).join('')}
                </ul>`;
        }

        // --- Service Worker Registration ---
        // Required both for offline caching (sw.js was previously never registered) and
        // for Push API notifications, which only deliver to a registered SW.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(e => console.error('SW registration failed:', e));
            });
        }

        // --- Install to Home Screen ---
        // Chrome/Edge/Android fire beforeinstallprompt and let us trigger the native install
        // dialog programmatically. iOS Safari never fires it (no programmatic install API), and
        // Chrome sometimes doesn't fire it either — it only fires once per page load and only
        // when its own heuristics are satisfied. So the UI never *depends* on the event: an
        // install affordance is always shown unless we're already running standalone, falling
        // back to manual browser-menu instructions when no programmatic prompt is available.
        let deferredInstallPrompt = null;

        function isRunningStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function isIosDevice() {
            return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
        }

        function setInstallStatus(msg, type) {
            const el = document.getElementById('installStatus');
            if (el) { el.textContent = msg; el.className = 'sync-status' + (type ? ' ' + type : ''); }
        }

        // Shows/hides both install affordances (drawer row + main-screen banner) based on
        // whether the app is already installed.
        function refreshInstallUI() {
            const row = document.getElementById('installRow');
            const banner = document.getElementById('installBanner');
            const installed = isRunningStandalone();
            if (row) row.style.display = installed ? 'none' : 'flex';
            if (banner) {
                const dismissed = localStorage.getItem('installBannerDismissed');
                banner.style.display = (!installed && !dismissed && appState.ui.activeTab === 'portfolio') ? 'flex' : 'none';
            }
        }

        function dismissInstallBanner() {
            localStorage.setItem('installBannerDismissed', '1');
            const banner = document.getElementById('installBanner');
            if (banner) banner.style.display = 'none';
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); // suppress Chrome's automatic mini-infobar — we show our own button instead
            deferredInstallPrompt = e;
            refreshInstallUI();
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            localStorage.setItem('installBannerDismissed', '1');
            refreshInstallUI();
            setInstallStatus('Installed ✓', 'ok');
        });

        async function installApp() {
            // Preferred path: the browser gave us a real deferred prompt.
            if (deferredInstallPrompt) {
                deferredInstallPrompt.prompt();
                const { outcome } = await deferredInstallPrompt.userChoice;
                deferredInstallPrompt = null;
                if (outcome === 'accepted') {
                    localStorage.setItem('installBannerDismissed', '1');
                    refreshInstallUI();
                    setInstallStatus('Installed ✓', 'ok');
                } else {
                    setInstallStatus('Install dismissed', '');
                }
                return;
            }
            // Fallback: no programmatic prompt available (iOS always; Chrome when its heuristics
            // haven't fired). Tell the person exactly where the manual option lives instead of
            // silently doing nothing.
            if (isIosDevice()) {
                showToast('On iPhone/iPad: tap Share in Safari, then "Add to Home Screen".', 7000);
            } else {
                showToast('Open your browser menu (⋮) and choose "Install app" or "Add to Home screen".', 7000);
            }
        }

        // --- Pull to Refresh ---
        // Each <main> scrolls internally (overflow-y: auto), not the window, so the gesture
        // has to be scoped per-container and gated on that container's own scrollTop, not
        // window.scrollY. Applies to Portfolio and Alerts (both show live data); skipped on
        // Guide since its content is static.
        (function setupPullToRefresh() {
            const indicator = document.getElementById('pullRefreshIndicator');
            const header = document.querySelector('header');
            if (!indicator || !header) return;

            const THRESHOLD = 64;   // px pulled before release triggers a refresh
            const MAX_PULL = 100;   // visual cap, with damping past this
            const containers = ['watchlist', 'alertsView'].map(id => document.getElementById(id)).filter(Boolean);

            let active = null;   // the container currently being pulled
            let startX = 0, startY = 0;
            let pulling = false;
            let refreshing = false;

            function resetIndicator() {
                indicator.style.transform = 'translateY(-40px)';
                indicator.style.opacity = '0';
                indicator.classList.remove('ready');
            }

            async function triggerRefresh() {
                refreshing = true;
                indicator.classList.add('refreshing');
                indicator.querySelector('.pull-refresh-text').textContent = 'Refreshing…';
                indicator.style.transform = `translateY(${THRESHOLD}px)`;
                indicator.style.opacity = '1';
                try {
                    await updateData(true);
                    if (appState.ui.activeTab === 'alerts') await loadAlertsFromServer();
                } catch (e) {
                    console.error('Pull-to-refresh failed:', e);
                } finally {
                    setTimeout(() => {
                        refreshing = false;
                        indicator.classList.remove('refreshing');
                        indicator.querySelector('.pull-refresh-text').textContent = 'Pull to refresh';
                        resetIndicator();
                    }, 350);
                }
            }

            containers.forEach(container => {
                container.addEventListener('touchstart', (e) => {
                    if (refreshing || container.style.display === 'none' || container.scrollTop > 0) { pulling = false; return; }
                    // The chart handles its own vertical gesture (price-axis panning), so a drag
                    // starting inside it must not also arm pull-to-refresh.
                    if (e.target.closest('.canvas-wrapper, .chart-container')) { pulling = false; return; }
                    active = container;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    pulling = true;
                    indicator.style.top = header.getBoundingClientRect().bottom + 'px';
                    indicator.style.transition = 'none';
                }, { passive: true });

                container.addEventListener('touchmove', (e) => {
                    if (!pulling || active !== container || refreshing) return;
                    const dx = e.touches[0].clientX - startX;
                    const delta = e.touches[0].clientY - startY;
                    // A horizontal swipe (e.g. swipe-to-delete on a card) dominates — back off
                    // entirely and let that gesture own the touch instead of fighting over it.
                    if (Math.abs(dx) > Math.abs(delta) && Math.abs(dx) > 10) { pulling = false; resetIndicator(); return; }
                    if (delta <= 0 || container.scrollTop > 0) { resetIndicator(); return; }
                    const pull = Math.min(delta * 0.5, MAX_PULL);
                    indicator.style.transform = `translateY(${pull - 40}px)`;
                    indicator.style.opacity = Math.min(pull / THRESHOLD, 1);
                    const ready = pull >= THRESHOLD;
                    indicator.classList.toggle('ready', ready);
                    indicator.querySelector('.pull-refresh-text').textContent = ready ? 'Release to refresh' : 'Pull to refresh';
                }, { passive: true });

                container.addEventListener('touchend', () => {
                    if (!pulling || active !== container) return;
                    pulling = false;
                    indicator.style.transition = 'opacity 0.15s, transform 0.15s';
                    if (indicator.classList.contains('ready') && !refreshing) {
                        triggerRefresh();
                    } else {
                        resetIndicator();
                    }
                });
            });
        })();

        // --- Swipe to Delete (Portfolio cards) ---
        // Attached to #watchlist alongside pull-to-refresh's own listeners on the same element;
        // rather than trying to suppress one from the other, each gesture independently checks
        // which axis (horizontal vs vertical) the drag actually committed to and only acts on
        // its own axis — see the matching dx-dominance check added to setupPullToRefresh above.
        (function setupSwipeToDelete() {
            const container = document.getElementById('watchlist');
            if (!container) return;

            const REVEAL_WIDTH = 90;        // must match .swipe-delete-bg width in CSS
            const AXIS_LOCK_THRESHOLD = 10; // px of movement before committing to an axis

            let activeFg = null;      // the .stock-card-fg element currently being dragged
            let activeTicker = null;
            let startX = 0, startY = 0;
            let axisLocked = null;    // null | 'horizontal' | 'vertical'
            let openTicker = null;    // ticker whose delete action is currently revealed, if any

            function closeOpenSwipe() {
                if (!openTicker) return;
                const fg = document.getElementById('cardfg-' + openTicker);
                if (fg) { fg.style.transition = 'transform 0.2s'; fg.style.transform = 'translateX(0)'; }
                openTicker = null;
            }

            container.addEventListener('touchstart', (e) => {
                // Chart canvases and control rows are descendants of the card, so their touch
                // events bubble here. Without this exclusion, horizontally panning a chart on
                // mobile would ALSO drag the card sideways toward delete — two gestures fighting
                // over the same drag. The chart owns its own pan/zoom handling.
                if (e.target.closest('.canvas-wrapper, .chart-container, .actions, .alert-form, .indicator-toggles, .tf-row, .zoom-row')) {
                    activeFg = null;
                    return;
                }
                const cardEl = e.target.closest('.stock-card');
                if (!cardEl) return;
                const ticker = cardEl.dataset.ticker;
                if (!ticker) return;
                if (openTicker && openTicker !== ticker) closeOpenSwipe();

                activeTicker = ticker;
                activeFg = document.getElementById('cardfg-' + ticker);
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                axisLocked = null;
                if (activeFg) activeFg.style.transition = 'none';
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!activeFg) return;
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;

                if (!axisLocked) {
                    if (Math.abs(dx) < AXIS_LOCK_THRESHOLD && Math.abs(dy) < AXIS_LOCK_THRESHOLD) return;
                    axisLocked = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
                }
                if (axisLocked !== 'horizontal') return; // vertical — leave it to normal scroll / pull-to-refresh

                let translate = Math.min(0, dx); // only allow left swipe (reveal)
                translate = Math.max(translate, -REVEAL_WIDTH - 24); // slight overswipe resistance cap
                activeFg.style.transform = `translateX(${translate}px)`;
            }, { passive: true });

            container.addEventListener('touchend', () => {
                if (!activeFg) return;
                activeFg.style.transition = 'transform 0.2s';

                if (axisLocked === 'horizontal') {
                    const match = activeFg.style.transform.match(/-?\d+\.?\d*/);
                    const currentX = match ? parseFloat(match[0]) : 0;
                    if (currentX <= -REVEAL_WIDTH * 0.6) {
                        activeFg.style.transform = `translateX(-${REVEAL_WIDTH}px)`;
                        openTicker = activeTicker;
                    } else {
                        activeFg.style.transform = 'translateX(0)';
                        if (openTicker === activeTicker) openTicker = null;
                    }
                }
                activeFg = null;
                activeTicker = null;
                axisLocked = null;
            });

            // Tapping anywhere outside the currently-revealed card closes it.
            document.addEventListener('touchstart', (e) => {
                if (!openTicker) return;
                const cardEl = e.target.closest('.stock-card');
                if (!cardEl || cardEl.dataset.ticker !== openTicker) closeOpenSwipe();
            }, { passive: true });
        })();

        // Swipe-delete now applies immediately and offers Undo, rather than interrupting with a
        // confirm() modal — reversible beats interrogative, and avoids the mis-tap-through problem.
        function confirmSwipeDelete(ticker) {
            deleteStock(ticker);
        }

        // --- Alert System Logic ---
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") Notification.requestPermission();
        }

        // --- Push Alerts (server-evaluated, reach the phone/watch even when app is closed) ---
        function setPushStatus(msg, type) {
            const el = document.getElementById('pushStatus');
            if (el) { el.textContent = msg; el.className = 'sync-status' + (type ? ' ' + type : ''); }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
            return outputArray;
        }

        async function enablePushAlerts() {
            if (!appState.cloudSynced) {
                setPushStatus('Cloud sync not confirmed yet — tap Save above first, or wait a moment and retry', 'error');
                return;
            }
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                setPushStatus('Push not supported on this browser', 'error');
                return;
            }

            setPushStatus('Enabling...', '');
            try {
                const perm = await Notification.requestPermission();
                if (perm !== 'granted') { setPushStatus('Notification permission denied', 'error'); return; }

                const keyRes = await fetch(`${CONFIG.WORKER_BASE}/api/vapid-public-key`);
                if (!keyRes.ok) {
                    let detail = `HTTP ${keyRes.status}`;
                    try { const j = await keyRes.json(); if (j.error) detail = j.error; } catch(e) {}
                    throw new Error(`VAPID key fetch failed (${detail})`);
                }
                const { publicKey } = await keyRes.json();

                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(publicKey),
                    });
                }

                const res = await fetch(`${CONFIG.WORKER_BASE}/api/push-subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: appState.pin, subscription: sub.toJSON() }),
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                appState.pushEnabled = true;
                document.getElementById('pushBtn').textContent = '🔔 Watch Alerts Enabled';
                refreshSyncBadges();

                // Confirm the full pipeline actually works end-to-end, right now, rather than
                // leaving it to chance whether a real alert ever successfully arrives later.
                setPushStatus('Enabled — sending a test notification...', 'ok');
                try {
                    const testRes = await fetch(`${CONFIG.WORKER_BASE}/api/push-test`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pin: appState.pin, subscription: sub.toJSON() }),
                    });
                    const testData = await testRes.json().catch(() => ({}));
                    if (testRes.ok && testData.sent) {
                        setPushStatus('Watch alerts enabled ✓ — check for the test notification', 'ok');
                    } else {
                        setPushStatus('Enabled, but the test notification failed to send — try again or check VAPID setup', 'error');
                    }
                } catch (e) {
                    setPushStatus('Enabled, but could not confirm delivery (offline?)', 'error');
                }
            } catch (e) {
                setPushStatus('Failed: ' + e.message, 'error');
            }
        }

        // Flattens appState.alerts ({ticker: [rules]}) into a single array with ticker attached,
        // and pushes it to the worker so the Cron Trigger can evaluate rules independent of the app.
        function syncAlertsToServer() {
            if (!appState.pin) return; // server-side evaluation requires a PIN to key off of
            const flat = Object.entries(appState.alerts).flatMap(([ticker, rules]) =>
                rules.map(r => ({ id: r.id, ticker, type: r.type, value: r.value }))
            );
            fetch(`${CONFIG.WORKER_BASE}/api/alerts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: appState.pin, rules: flat }),
            }).then(res => {
                appState.cloudSynced = res.ok;
                refreshSyncBadges();
            }).catch(() => {
                appState.cloudSynced = false;
                refreshSyncBadges();
            });
        }

        // Pulls server-side rules (which carry armed/lastTriggered state maintained by the cron
        // evaluator) back into appState.alerts, keyed by ticker, on load / after PIN sync.
        async function loadAlertsFromServer() {
            if (!appState.pin) return false;
            try {
                const res = await fetch(`${CONFIG.WORKER_BASE}/api/alerts?pin=${encodeURIComponent(appState.pin)}`);
                if (!res.ok) return false;
                const data = await res.json();
                if (!Array.isArray(data.rules)) return false;
                const byTicker = {};
                data.rules.forEach(r => {
                    if (!byTicker[r.ticker]) byTicker[r.ticker] = [];
                    byTicker[r.ticker].push({ id: r.id, ind: r.type, val: r.value, triggered: !r.armed });
                });
                appState.alerts = byTicker;
                localStorage.setItem('alerts', JSON.stringify(appState.alerts));
                refreshAlertsNavBadge(); // triggered flags come from the server — reflect them immediately
                return true;
            } catch (e) { return false; /* best-effort */ }
        }

        // Core of adding a preset/custom alert — mutates state only, no save/sync/render side
        // effects, so callers (single-ticker or multi-select batch) control when those happen.
        // Returns true if a new rule was added, false if an identical one already existed.
        function _addAlertRuleSilent(ticker, type, value) {
            ensureTickerState(ticker);
            const exists = appState.alerts[ticker].some(a => a.ind === type && a.val === value);
            if (exists) return false;
            // Date.now() alone can collide when adding to several tickers in the same tick
            // (multi-select apply); the random suffix keeps ids unique within a batch.
            const id = Date.now() + Math.random();
            appState.alerts[ticker].push({ id, ind: type, val: value, triggered: false });
            return true;
        }

        // Adds a quick-preset alert (drop %, RSI band) to a single ticker, e.g. from a stock card.
        function addPresetAlert(ticker, type, value) {
            if (!_addAlertRuleSilent(ticker, type, value)) return;
            localStorage.setItem('alerts', JSON.stringify(appState.alerts));
            syncAlertsToServer();
            renderUI();
        }

        // Alert type metadata — single source of truth for label text + hit test, shared by the
        // manual form, quick-preset buttons, and the foreground evaluator. Mirrors the type
        // strings the worker's Cron Trigger understands (see ALERT_TYPES in worker.js) so alerts
        // created here evaluate identically server-side even when the app is closed.
        const ALERT_TYPE_META = {
            price_drop_pct: { label: v => `Drop ${v}%`,     metric: 'changePct', hit: (v, c) => c !== null && c <= -v },
            price_rise_pct: { label: v => `Rise ${v}%`,     metric: 'changePct', hit: (v, c) => c !== null && c >= v },
            rsi_below:      { label: v => `RSI < ${v}`,     metric: 'rsi',       hit: (v, c) => c !== null && c < v },
            rsi_above:      { label: v => `RSI > ${v}`,     metric: 'rsi',       hit: (v, c) => c !== null && c > v },
            price_above:    { label: v => `Price > $${v}`,  metric: 'price',     hit: (v, c) => c !== null && c > v },
            price_below:    { label: v => `Price < $${v}`,  metric: 'price',     hit: (v, c) => c !== null && c < v },
            sma_above:      { label: v => `SMA50 > $${v}`,  metric: 'sma',       hit: (v, c) => c !== null && c > v },
            sma_below:      { label: v => `SMA50 < $${v}`,  metric: 'sma',       hit: (v, c) => c !== null && c < v },
        };

        // Foreground quick-check: fires a browser Notification immediately if the app happens to
        // be open when a threshold is crossed. The authoritative, always-on evaluation (including
        // while the app/phone is closed) runs server-side via the Cron Trigger — see syncAlertsToServer.
        function evaluateAlerts(ticker) {
            const data = getTickerData(ticker);
            if(!data || !appState.alerts[ticker] || !appState.alerts[ticker].length) return;
            if (!Array.isArray(data.prices) || !data.prices.length || !data.computed) return;

            const prices = data.prices;
            const currentPrice = prices[prices.length-1];
            const prevClose = prices.length > 1 ? prices[prices.length-2] : null;
            const changePct = prevClose ? ((currentPrice - prevClose) / prevClose) * 100 : null;
            const rsiArr = data.computed.rsi || [];
            const smaArr = data.computed.sma || [];
            const rsi = rsiArr.length ? rsiArr[rsiArr.length-1] : null;
            const sma = smaArr.length ? smaArr[smaArr.length-1] : null;
            const ctx = { price: currentPrice, rsi, sma, changePct };

            let stateChanged = false;

            appState.alerts[ticker].forEach(al => {
                if(al.triggered) return;
                const meta = ALERT_TYPE_META[al.ind];
                if (!meta) return;
                const current = ctx[meta.metric];
                if (meta.hit(al.val, current)) {
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification(`📈 Alert Triggered: ${ticker}`, { body: `${meta.label(al.val)} (currently ${current !== null ? current.toFixed(2) : '—'})` });
                    }
                    al.triggered = true;
                    stateChanged = true;
                }
            });

            if(stateChanged) {
                localStorage.setItem('alerts', JSON.stringify(appState.alerts));
                syncAlertsToServer();
            }
        }

        function addCustomAlert(ticker) {
            requestNotificationPermission();
            const ind = document.getElementById(`alt-type-${ticker}`).value;
            const val = parseFloat(document.getElementById(`alt-val-${ticker}`).value);

            if(isNaN(val)) return alert("Please enter a valid number");

            if (!_addAlertRuleSilent(ticker, ind, val)) return; // identical rule already exists
            localStorage.setItem('alerts', JSON.stringify(appState.alerts));
            syncAlertsToServer();
            renderUI();
        }

        function deleteAlert(ticker, id) {
            appState.alerts[ticker] = appState.alerts[ticker].filter(a => a.id !== id);
            localStorage.setItem('alerts', JSON.stringify(appState.alerts));
            syncAlertsToServer();
            renderUI();
        }

        // ============================================================
        // Alerts Tab — multi-select ticker view for applying one alert
        // to several stocks at once, and a consolidated list of every
        // active alert across the whole watchlist in one place.
        // ============================================================
        const selectedAlertTickers = new Set();

        function setAlertsTabStatus(msg, type) {
            const el = document.getElementById('alertsTabStatus');
            if (el) { el.textContent = msg; el.className = 'sync-status' + (type ? ' ' + type : ''); }
        }

        // Keeps the sticky bulk-action bar in sync with the current selection — shown only
        // while the Alerts tab is active and at least one ticker is checked.
        // Counts alerts that have fired (armed=false server-side → triggered=true locally) and
        // surfaces them as a badge on the Alerts nav tab. Without this, a fired alert is only
        // visible as a ⚠️ inside a collapsed card — easy to miss entirely, which undercuts the
        // whole point of having alerts.
        function countTriggeredAlerts() {
            return Object.values(appState.alerts).reduce(
                (sum, rules) => sum + (Array.isArray(rules) ? rules.filter(r => r.triggered).length : 0), 0
            );
        }

        function refreshAlertsNavBadge() {
            const badge = document.getElementById('alertsNavBadge');
            if (!badge) return;
            const count = countTriggeredAlerts();
            badge.textContent = count > 9 ? '9+' : String(count);
            badge.style.display = count > 0 ? 'block' : 'none';
        }

        function updateBulkAlertBar() {
            const bar = document.getElementById('bulkAlertBar');
            if (!bar) return;
            const count = selectedAlertTickers.size;
            const inManageView = (appState.ui.alertsSubView || 'manage') === 'manage';
            const visible = count > 0 && appState.ui.activeTab === 'alerts' && inManageView;
            bar.style.display = visible ? 'block' : 'none';
            const countEl = document.getElementById('bulkAlertCount');
            if (countEl) countEl.textContent = `${count} selected`;
        }

        function toggleAlertTickerSelection(ticker, checked) {
            if (checked) selectedAlertTickers.add(ticker); else selectedAlertTickers.delete(ticker);
        }

        // Toggles selection for a whole row tap. Taps inside .alert-ticker-rules (existing
        // alert badges / delete buttons) are excluded via stopPropagation on that element.
        function handleAlertRowTap(ticker) {
            toggleAlertTickerSelection(ticker, !selectedAlertTickers.has(ticker));
            renderAlertsTab();
        }

        function selectAllAlertTickers(select) {
            if (select) activeWatchlist().forEach(t => selectedAlertTickers.add(t));
            else selectedAlertTickers.clear();
            renderAlertsTab();
        }

        function toggleBulkCustomForm() {
            const form = document.getElementById('bulkCustomForm');
            if (form) form.style.display = form.style.display === 'none' ? 'flex' : 'none';
        }

        // Applies a quick preset (drop %, RSI band) to every currently checked ticker in one shot —
        // saves/syncs/renders once at the end rather than once per ticker.
        function addPresetAlertToSelected(type, value) {
            if (!selectedAlertTickers.size) { setAlertsTabStatus('Select at least one stock first', 'error'); return; }
            let added = 0;
            selectedAlertTickers.forEach(ticker => { if (_addAlertRuleSilent(ticker, type, value)) added++; });
            if (added) {
                localStorage.setItem('alerts', JSON.stringify(appState.alerts));
                syncAlertsToServer();
            }
            setAlertsTabStatus(added ? `Added to ${added} stock${added === 1 ? '' : 's'}` : 'Already set on all selected stocks', added ? 'ok' : '');
            renderAlertsTab();
            renderUI();
        }

        // Same batch-apply, but for the custom type/value form instead of a preset button.
        function addCustomAlertToSelected() {
            if (!selectedAlertTickers.size) { setAlertsTabStatus('Select at least one stock first', 'error'); return; }
            const ind = document.getElementById('alertsTab-type').value;
            const val = parseFloat(document.getElementById('alertsTab-val').value);
            if (isNaN(val)) { setAlertsTabStatus('Enter a valid number', 'error'); return; }

            requestNotificationPermission();
            let added = 0;
            selectedAlertTickers.forEach(ticker => { if (_addAlertRuleSilent(ticker, ind, val)) added++; });
            if (added) {
                localStorage.setItem('alerts', JSON.stringify(appState.alerts));
                syncAlertsToServer();
            }
            setAlertsTabStatus(added ? `Added to ${added} stock${added === 1 ? '' : 's'}` : 'Already set on all selected stocks', added ? 'ok' : '');
            renderAlertsTab();
            renderUI();
        }

        function deleteAlertFromTab(ticker, id) {
            deleteAlert(ticker, id); // already saves/syncs/re-renders the portfolio
            renderAlertsTab();
        }

        function setAlertsSubView(view) {
            appState.ui.alertsSubView = view;
            renderAlertsTab();
        }

        function renderAlertsTab() {
            const container = document.getElementById('alertsView');
            if (!container) return;
            const subView = appState.ui.alertsSubView || 'manage';

            const subViewTabs = `
                <div class="alerts-subview-tabs">
                    <button class="subview-tab${subView === 'manage' ? ' active' : ''}" onclick="setAlertsSubView('manage')">Manage</button>
                    <button class="subview-tab${subView === 'history' ? ' active' : ''}" onclick="setAlertsSubView('history')">📜 History</button>
                </div>`;

            if (subView === 'history') {
                renderAlertHistoryView(container, subViewTabs);
                updateBulkAlertBar();
                return;
            }

            if (!activeWatchlist().length) {
                container.innerHTML = subViewTabs + '<div class="info-card">No stocks tracked yet — add one from the Portfolio tab.</div>';
                updateBulkAlertBar();
                return;
            }

            const rows = getSortedWatchlist().map(ticker => {
                ensureTickerState(ticker);
                const data = getTickerData(ticker);
                let meta = '—';
                if (data && data.computed && data.prices && data.prices.length) {
                    const price = data.prices[data.prices.length - 1];
                    const rsiArr = data.computed.rsi || [];
                    const rsi = rsiArr.length ? rsiArr[rsiArr.length - 1] : null;
                    meta = `$${price.toFixed(2)}` + (rsi !== null && rsi !== undefined ? ` · RSI ${rsi.toFixed(1)}` : '');
                }

                const rules = appState.alerts[ticker] || [];
                const rulesHtml = rules.length
                    ? rules.map(a => `
                        <div class="active-alert">
                            <span>${a.triggered ? '⚠️' : '🔔'} ${ALERT_TYPE_META[a.ind] ? ALERT_TYPE_META[a.ind].label(a.val) : a.ind}</span>
                            <button class="del-alert" onclick="deleteAlertFromTab('${ticker}', ${a.id})">✕</button>
                        </div>`).join('')
                    : '<div class="alert-ticker-empty">No alerts set</div>';

                const isSelected = selectedAlertTickers.has(ticker);
                return `
                    <div class="alert-ticker-row${isSelected ? ' selected' : ''}" onclick="handleAlertRowTap('${ticker}')">
                        <div class="alert-ticker-label">
                            <input type="checkbox" class="alert-ticker-check" value="${ticker}" ${isSelected ? 'checked' : ''} tabindex="-1" style="pointer-events:none;">
                            <span class="alert-ticker-name">${ticker}</span>
                            <span class="alert-ticker-meta">${meta}</span>
                        </div>
                        <div class="alert-ticker-rules" onclick="event.stopPropagation()">${rulesHtml}</div>
                    </div>`;
            }).join('');

            container.innerHTML = subViewTabs + `
                <div class="alerts-tab-header">
                    <div class="alerts-select-row">
                        <button class="preset-btn" onclick="selectAllAlertTickers(true)">Select All</button>
                        <button class="preset-btn" onclick="selectAllAlertTickers(false)">Clear</button>
                        <span class="alerts-select-count" id="alertsSelectCount">${selectedAlertTickers.size} selected</span>
                    </div>
                    <div style="margin-top:8px;">${getSortSelectHTML('alerts')}</div>
                    <div style="font-size:0.7rem;color:var(--text-sub);margin-top:8px;">
                        Tap a stock to select it, then use the bar below to apply an alert to everything you've picked.
                    </div>
                    <div class="sync-badge-slot">${getSyncBadgeHTML()}</div>
                </div>
                <div class="alerts-ticker-list">${rows}</div>
            `;
            updateBulkAlertBar();
        }

        // Renders the alert-history sub-view. Fetches fresh from the server each time it's
        // opened (history is cheap and small — capped at 50 entries server-side) rather than
        // caching locally, so it always reflects what the cron evaluator has actually fired.
        async function renderAlertHistoryView(container, subViewTabs) {
            if (!appState.cloudSynced) {
                container.innerHTML = subViewTabs + '<div class="info-card">⚠️ Not yet confirmed synced to cloud — tap ☁️ above to retry. History is tracked server-side alongside the cloud evaluator.</div>';
                return;
            }

            container.innerHTML = subViewTabs + '<div class="info-card">Loading history...</div>';
            try {
                const res = await fetch(`${CONFIG.WORKER_BASE}/api/alerts/history?pin=${encodeURIComponent(appState.pin)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const history = Array.isArray(data.history) ? data.history : [];

                // Guard against a stale response landing after the user navigated away.
                if (appState.ui.activeTab !== 'alerts' || (appState.ui.alertsSubView || 'manage') !== 'history') return;

                if (!history.length) {
                    container.innerHTML = subViewTabs + '<div class="info-card">No alerts have fired yet.</div>';
                    return;
                }

                const items = history.map(h => {
                    const when = new Date(h.triggeredAt);
                    const timeStr = isNaN(when.getTime()) ? '' : when.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    return `
                        <div class="history-item">
                            <div class="history-item-main">
                                <span class="history-item-ticker">${escapeHtml(h.ticker)}</span>
                                <span class="history-item-msg">${escapeHtml(h.message)}</span>
                            </div>
                            <span class="history-item-time">${timeStr}</span>
                        </div>`;
                }).join('');

                container.innerHTML = subViewTabs + `<div class="history-list">${items}</div>`;
            } catch (e) {
                if (appState.ui.activeTab === 'alerts' && (appState.ui.alertsSubView || 'manage') === 'history') {
                    container.innerHTML = subViewTabs + `<div class="info-card error-card">Failed to load history: ${e.message}</div>`;
                }
            }
        }

        // --- Debounced renderUI ---
        // Batches rapid successive calls (e.g. N tickers arriving concurrently)
        // into a single DOM update on the next animation frame.
        let _renderPending = false;
        function renderUI() {
            if (_renderPending) return;
            _renderPending = true;
            requestAnimationFrame(() => {
                _renderPending = false;
                _doRenderUI();
            });
        }
        function _doRenderUI() {
            const container = document.getElementById('watchlist');
            if (!container) return;
            refreshAlertsNavBadge(); // central hook — runs on every state change, no per-callsite patching
            if(activeWatchlist().length === 0) {
                container.innerHTML = '<div class="info-card">No stocks tracked. Add one above.</div>';
                if (appState.ui.activeTab === 'alerts') renderAlertsTab();
                return;
            }
            
            let html = '';
            for (let ticker of getSortedWatchlist()) {
                try {
                    html += renderStockCard(ticker);
                } catch (e) {
                    // Guardrail: one ticker's bad data must never break the whole list.
                    console.error(`renderUI failed for ${ticker}:`, e);
                    html += `
                        <div class="info-card error-card">
                            <div><strong>${ticker}</strong>: Display error (${e.message || 'unknown'})</div>
                            <div style="display:flex;gap:8px;margin-top:8px;">
                                <button class="retry-btn" onclick="retryStock('${ticker}')">Retry</button>
                                <button class="retry-btn" style="color:var(--sell-color)" onclick="deleteStock('${ticker}')">Remove</button>
                            </div>
                        </div>`;
                }
            }

            container.innerHTML = html;
            activeWatchlist().forEach(ticker => {
                // Chart canvas only exists in the DOM while its card is expanded (see toggleCardExpanded)
                if (appState.ui.cardExpanded[ticker] && appState.ui.charts[ticker] && getTickerData(ticker)) {
                    try { drawChart(ticker); } catch (e) { console.error(`drawChart failed for ${ticker}:`, e); }
                }
            });
            // Re-apply active filter after DOM rebuild
            const filterInput = document.getElementById('filterInput');
            if (filterInput && filterInput.value) filterWatchlist(filterInput.value);

            // Keep the Alerts tab's price/RSI meta and rule list current if it's the visible tab
            if (appState.ui.activeTab === 'alerts') renderAlertsTab();
        } // end _doRenderUI

        // Targeted update: toggle one indicator button + redraw only that ticker's chart.
        // Much cheaper than a full renderUI() when only one thing changed.
        function updateIndicatorButton(ticker, key, active) {
            const btn = document.querySelector(`button[onclick*="'${ticker}', 'ind', '${key}'"]`);
            if (btn) btn.classList.toggle('active', active);
        }

        // Ensures per-ticker state objects exist, regardless of how the ticker entered the watchlist
        // (typed in, loaded from PIN sync, etc.) — guards against undefined access anywhere downstream.
        function ensureTickerState(ticker) {
            if (!appState.indicators[ticker]) appState.indicators[ticker] = {sma:false, sma20:false, sma200:false, ema20:false, bb:false, rsi:false, macd:false, volume:true, pivot:false, swing:false};
            if (!appState.alerts[ticker]) appState.alerts[ticker] = [];
        }

        function renderStockCard(ticker) {
            ensureTickerState(ticker);
            const data = getTickerData(ticker);

            if(!data) {
                if(appState.errors[ticker]) {
                    return `
                        <div class="info-card error-card">
                            <div><strong>${ticker}</strong>: ${appState.errors[ticker]}</div>
                            <div style="display:flex;gap:8px;margin-top:8px;">
                                <button class="retry-btn" onclick="retryStock('${ticker}')">Retry</button>
                                <button class="retry-btn" style="color:var(--sell-color)" onclick="deleteStock('${ticker}')">Remove</button>
                            </div>
                        </div>`;
                }
                return `<div class="info-card">${ticker}: Loading...</div>`;
            }

            // Guardrail: malformed/empty data shouldn't crash — show an error card instead.
            if (!Array.isArray(data.prices) || data.prices.length === 0 || !data.computed) {
                return `
                    <div class="info-card error-card">
                        <div><strong>${ticker}</strong>: No usable price data</div>
                        <div style="display:flex;gap:8px;margin-top:8px;">
                            <button class="retry-btn" onclick="retryStock('${ticker}')">Retry</button>
                            <button class="retry-btn" style="color:var(--sell-color)" onclick="deleteStock('${ticker}')">Remove</button>
                        </div>
                    </div>`;
            }

            const prices = data.prices;
            const currentPrice = prices[prices.length-1];
            const prevPrice = prices.length > 1 ? prices[prices.length-2] : currentPrice;
            const isBullish = currentPrice >= prevPrice;

            // Day change: use last candle's open vs close if OHLC available (accurate)
            // otherwise fall back to prev close vs current close
            const ohlcArr = data.ohlc || [];
            const lastCandle = ohlcArr.length ? ohlcArr[ohlcArr.length-1] : null;
            const changeBase = (lastCandle && lastCandle.o !== null) ? lastCandle.o : prevPrice;
            const changeAbs = currentPrice - changeBase;
            const changePct = changeBase !== 0 ? (changeAbs / changeBase) * 100 : 0;
            const changeSign = changeAbs >= 0 ? '+' : '';
            const changeColor = changeAbs >= 0 ? 'var(--buy-color)' : 'var(--sell-color)';
            const changeLabel = `${changeSign}${changeAbs.toFixed(2)} (${changeSign}${changePct.toFixed(2)}%)`;

            // Extended-hours quotes. Both are measured against the regular-session close (not
            // the previous day's), which is how brokerages quote extended moves.
            //
            // marketState is NOT limited to PRE/REGULAR/POST — outside those narrow windows it
            // reports CLOSED / PREPRE / POSTPOST while still carrying the prices from the
            // sessions that already happened. So rather than matching exact state strings, we
            // show whichever extended prices exist and differ from the regular close, and keep
            // showing them after their window ends.
            //
            // When both exist they're ordered newest-first, which depends on where we are in the
            // cycle: during/after the post session the after-hours print is the latest; once
            // pre-market opens the next morning, the pre print is.
            const meta = data.meta || {};
            let extHtml = '';
            const state = meta.marketState || '';
            const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
            const regClose = num(meta.regularMarketPrice) !== null ? meta.regularMarketPrice : currentPrice;

            if (state !== 'REGULAR' && regClose) {
                const buildExt = (price, label) => {
                    // Skip when identical to the close — no extended trading actually happened,
                    // and "After $X 0.00%" is noise rather than information.
                    if (price === null || Math.abs(price - regClose) <= 0.004) return '';
                    const abs = price - regClose;
                    const pct = regClose !== 0 ? (abs / regClose) * 100 : 0;
                    const sign = abs >= 0 ? '+' : '';
                    const color = abs >= 0 ? 'var(--buy-color)' : 'var(--sell-color)';
                    return `<span class="price-ext" style="color:${color}">${label} $${price.toFixed(2)} ${sign}${pct.toFixed(2)}%</span>`;
                };

                const preHtml = buildExt(num(meta.preMarketPrice), 'Pre');
                const postHtml = buildExt(num(meta.postMarketPrice), 'After');
                const preIsNewer = (state === 'PRE' || state === 'PREPRE');
                extHtml = preIsNewer ? (preHtml + postHtml) : (postHtml + preHtml);
            }

            const computed = data.computed;
            const rsiArr = computed.rsi || [];
            const smaArr = computed.sma || [];
            const rsiVal = rsiArr.length ? rsiArr[rsiArr.length-1] : null;
            const smaVal = smaArr.length ? smaArr[smaArr.length-1] : null;
            const rsi = (rsiVal !== null && rsiVal !== undefined) ? rsiVal.toFixed(1) : '—';
            const sma = (smaVal !== null && smaVal !== undefined) ? smaVal.toFixed(2) : '—';

            const comp = computed.composite || { signal: 'HOLD', reasons: [] };
            const sigClass = comp.signal === 'BUY' ? 'buy' : comp.signal === 'SELL' ? 'sell' : 'hold';

            const ui = appState.ui;
            const inds = appState.indicators[ticker];
            const expanded = !!ui.cardExpanded[ticker];

            let alertsHtml = (appState.alerts[ticker] || []).map(a => `
                <div class="active-alert">
                    <span>${a.triggered ? '⚠️' : '🔔'} ${ALERT_TYPE_META[a.ind] ? ALERT_TYPE_META[a.ind].label(a.val) : (a.ind + ' ' + (a.cond||'') + ' ' + a.val)}</span>
                    <button class="del-alert" onclick="deleteAlert('${ticker}', ${a.id})">✕</button>
                </div>
            `).join('');

            let newsHtml = '<div style="text-align:center;color:var(--text-sub);font-size:0.85rem;">Loading news...</div>';
            if (appState.newsCache[ticker]) {
                const newsItems = appState.newsCache[ticker] || [];
                newsHtml = newsItems.length === 0 ? '<div style="color:var(--text-sub);font-size:0.8rem;">No recent news found.</div>' :
                    newsItems.map(n => `
                    <div class="news-item">
                        <a href="${n.link || '#'}" target="_blank">${n.title || 'Untitled'}</a>
                        <div class="news-date">${n.publisher || ''} • ${n.providerPublishTime ? new Date(n.providerPublishTime*1000).toLocaleDateString() : ''}</div>
                    </div>`).join('');
            }

            return `
                <div class="stock-card sig-${sigClass}" data-ticker="${ticker}">
                    <div class="swipe-delete-bg" onclick="confirmSwipeDelete('${ticker}')">
                        <span>🗑</span><span>Delete</span>
                    </div>
                    <div class="stock-card-fg" id="cardfg-${ticker}">
                    <div class="card-inner">
                        <div class="card-top">
                            <div class="card-left">
                                <h2 class="ticker">${ticker}</h2>
                                <span class="company-meta">RSI ${rsi} · SMA $${sma}</span>
                            </div>
                            <div class="card-right">
                                <div class="price-block">
                                    <h2 class="price" style="color:${changeColor}">$${currentPrice.toFixed(2)}</h2>
                                    <span class="price-change" style="color:${changeColor}">${changeLabel}</span>
                                    ${extHtml}
                                </div>
                                <span class="badge ${sigClass}">${comp.signal}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Signal (tap to expand — also reveals chart/news/alerts/remove actions) -->
                    <div class="signal-panel${expanded ? ' expanded' : ''}" id="signal-panel-${ticker}" onclick="toggleCardExpanded('${ticker}')">
                        ${buildSignalInnerHTML(comp, expanded)}
                    </div>

                    ${!expanded ? '' : `
                    <!-- Panel: CHART -->
                    <div class="panel chart-container ${ui.charts[ticker] ? 'active' : ''}">
                        <div class="tf-row">
                            ${Object.keys(CONFIG.TIMEFRAMES).map(tf => `
                            <button id="tf-${ticker}-${tf}" class="tf-btn ${getActiveTf(ticker)===tf?'active':''}" onclick="switchTimeframe('${ticker}','${tf}')">${tf}</button>`).join('')}
                        </div>
                        <div class="indicator-toggles">
                            <button class="ind-btn ${inds.volume?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'volume')">Vol</button>
                            <button class="ind-btn ${inds.sma?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'sma')">SMA50</button>
                            <button class="ind-btn ${inds.sma20?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'sma20')">SMA20</button>
                            <button class="ind-btn ${inds.sma200?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'sma200')">SMA200</button>
                            <button class="ind-btn ${inds.ema20?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'ema20')">EMA20</button>
                            <button class="ind-btn ${inds.bb?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'bb')">BB</button>
                            <button class="ind-btn ${inds.pivot?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'pivot')">Pivots</button>
                            <button class="ind-btn ${inds.swing?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'swing')">Swings</button>
                            <span class="ind-sep"></span>
                            <button class="ind-btn ${inds.rsi?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'rsi')">RSI</button>
                            <button class="ind-btn ${inds.macd?'active':''}" onclick="toggleUI('${ticker}', 'ind', 'macd')">MACD</button>
                        </div>
                        <div class="zoom-row">
                            <button class="zoom-btn" onclick="zoomIn('${ticker}', appState.dataCache['${ticker}']?.prices?.length||252);drawChart('${ticker}')">＋</button>
                            <button class="zoom-btn" onclick="zoomOut('${ticker}', appState.dataCache['${ticker}']?.prices?.length||252);drawChart('${ticker}')">－</button>
                            <button class="zoom-btn" onclick="zoomReset('${ticker}');drawChart('${ticker}')">1Y</button>
                            <button class="zoom-btn" onclick="zoomToNow('${ticker}');drawChart('${ticker}')" title="Jump to most recent dates">▶ Now</button>
                        </div>
                        <div class="chart-legend-values" id="legend-${ticker}"></div>
                        <div class="canvas-wrapper" style="position:relative;">
                            <canvas id="canvas-${ticker}" style="position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>
                            <canvas id="canvas-cross-${ticker}" style="position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;"></canvas>
                        </div>
                        <div class="crosshair-tooltip" id="xhair-${ticker}" style="display:none;"></div>
                    </div>

                    <!-- Panel: NEWS -->
                    <div class="panel ${ui.news[ticker] ? 'active' : ''}">${newsHtml}</div>

                    <!-- Panel: ALERTS -->
                    <div class="panel ${ui.alerts[ticker] ? 'active' : ''}">
                        <div style="margin-bottom:8px;">${alertsHtml}</div>
                        <div style="font-size:0.72rem;color:var(--text-sub);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;">Quick Add</div>
                        <div class="alert-presets">
                            <button class="preset-btn" onclick="addPresetAlert('${ticker}','price_drop_pct',5)">🔻 -5%</button>
                            <button class="preset-btn" onclick="addPresetAlert('${ticker}','price_drop_pct',10)">🔻 -10%</button>
                            <button class="preset-btn" onclick="addPresetAlert('${ticker}','price_drop_pct',15)">🔻 -15%</button>
                            <button class="preset-btn" onclick="addPresetAlert('${ticker}','rsi_below',30)">RSI &lt; 30</button>
                            <button class="preset-btn" onclick="addPresetAlert('${ticker}','rsi_above',70)">RSI &gt; 70</button>
                        </div>
                        <div style="font-size:0.72rem;color:var(--text-sub);margin:8px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;">Custom Alert</div>
                        <div class="alert-form">
                            <select id="alt-type-${ticker}">
                                <option value="price_drop_pct">Price drops %</option>
                                <option value="price_rise_pct">Price rises %</option>
                                <option value="rsi_below">RSI below</option>
                                <option value="rsi_above">RSI above</option>
                                <option value="price_above">Price above $</option>
                                <option value="price_below">Price below $</option>
                                <option value="sma_above">SMA50 above $</option>
                                <option value="sma_below">SMA50 below $</option>
                            </select>
                            <input type="number" id="alt-val-${ticker}" placeholder="Value">
                            <button onclick="addCustomAlert('${ticker}')">Set</button>
                        </div>
                        <div class="sync-badge-slot">${getSyncBadgeHTML()}</div>
                    </div>

                    <!-- Icon-only action bar -->
                    <div class="actions">
                        <button class="icon-btn ${ui.charts[ticker]?'active':''}" onclick="toggleUI('${ticker}', 'panel', 'charts')" title="Chart">📈</button>
                        <button class="icon-btn ${ui.news[ticker]?'active':''}" onclick="toggleUI('${ticker}', 'panel', 'news')" title="News">📰</button>
                        <button class="icon-btn ${ui.alerts[ticker]?'active':''}" onclick="toggleUI('${ticker}', 'panel', 'alerts')" title="Alerts">🔔</button>
                        <button class="icon-btn" onclick="deleteStock('${ticker}')" title="Remove">✕</button>
                    </div>
                    `}
                    </div>
                </div>
            `;
        }

        // --- Candlestick Chart Plugin (native, no external dependency) ---
        // Registers a custom 'candlestick' chart type with Chart.js once.
        // roundRect polyfill for older browsers/WebViews
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                r = Math.min(r, w/2, h/2);
                this.beginPath();
                this.moveTo(x+r, y); this.lineTo(x+w-r, y); this.arcTo(x+w,y, x+w,y+r, r);
                this.lineTo(x+w, y+h-r); this.arcTo(x+w,y+h, x+w-r,y+h, r);
                this.lineTo(x+r, y+h); this.arcTo(x,y+h, x,y+h-r, r);
                this.lineTo(x, y+r); this.arcTo(x,y, x+r,y, r);
                this.closePath(); return this;
            };
        }

        // --- Price Action Indicators ---
        function getPivotPoints(ohlc) {
            if (!ohlc || ohlc.length < 2) return null;
            const prev = ohlc[ohlc.length - 2];
            if (!prev || prev.h === null) return null;
            const pp = (prev.h + prev.l + prev.c) / 3;
            return { pp, r1:2*pp-prev.l, r2:pp+(prev.h-prev.l), s1:2*pp-prev.h, s2:pp-(prev.h-prev.l) };
        }

        function getSwingPoints(ohlc, lookback = 5) {
            const highs = [], lows = [];
            if (!ohlc || ohlc.length < lookback*2+1) return { highs, lows };
            for (let i = lookback; i < ohlc.length-lookback; i++) {
                const c = ohlc[i];
                if (!c || c.h === null) continue;
                const win = ohlc.slice(i-lookback, i+lookback+1);
                if (win.some(w => !w || w.h === null)) continue;
                if (c.h >= Math.max(...win.map(w => w.h))) highs.push({ x:i, y:c.h });
                if (c.l <= Math.min(...win.map(w => w.l))) lows.push({ x:i, y:c.l });
            }
            return { highs, lows };
        }

        // --- Chart State (zoom/pan per ticker) ---
        // zoomState[ticker] = { start: 0.0, end: 1.0 } — fraction of total data visible (X-axis/time)
        // yZoomState[ticker] = { padMultiplier: 1.0 } — manual override of the price-axis auto-fit padding
        const zoomState = {};
        const yZoomState = {};
        // yPanState[ticker] = { offset: 0 } — vertical shift of the price window, as a fraction
        // of the visible price range. Positive = view moves toward higher prices.
        const yPanState = {};

        // Mobile browsers emit synthetic mouse events (mousedown/mousemove/mouseup) shortly
        // after every touch. Without this guard, a tap on a phone would spuriously enter the
        // desktop drag path. Lives at file scope so it survives the canvas being cloned and
        // replaced on each redraw.
        let _lastTouchAt = 0;
        const SYNTHETIC_MOUSE_WINDOW_MS = 700;
        function isSyntheticMouseEvent() {
            return Date.now() - _lastTouchAt < SYNTHETIC_MOUSE_WINDOW_MS;
        }

        function panYAxis(ticker, fracDelta) {
            if (!yPanState[ticker]) yPanState[ticker] = { offset: 0 };
            // Clamped so you can't drift so far the candles leave the viewport entirely.
            yPanState[ticker].offset = Math.max(-3, Math.min(3, yPanState[ticker].offset + fracDelta));
        }
        function getZoom(ticker, totalLen) {
            if (!zoomState[ticker]) zoomState[ticker] = { start: 0, end: 1 };
            const z = zoomState[ticker];
            const s = Math.max(0, Math.min(1, z.start));
            const e = Math.max(0, Math.min(1, z.end));
            const minWindow = Math.max(10, Math.floor(totalLen * 0.05));
            const startIdx = Math.floor(s * totalLen);
            const endIdx = Math.min(totalLen, Math.max(startIdx + minWindow, Math.ceil(e * totalLen)));
            return { startIdx, endIdx };
        }
        function zoomIn(ticker, totalLen) {
            if (!zoomState[ticker]) zoomState[ticker] = { start:0, end:1 };
            const z = zoomState[ticker];
            const mid = (z.start + z.end) / 2;
            const half = (z.end - z.start) * 0.3;
            zoomState[ticker] = { start: Math.max(0, mid-half), end: Math.min(1, mid+half) };
        }
        function zoomOut(ticker, totalLen) {
            if (!zoomState[ticker]) zoomState[ticker] = { start:0, end:1 };
            const z = zoomState[ticker];
            const mid = (z.start + z.end) / 2;
            const half = (z.end - z.start) * 0.85;
            zoomState[ticker] = { start: Math.max(0, mid-half), end: Math.min(1, mid+half) };
        }
        function zoomReset(ticker) { zoomState[ticker] = { start:0, end:1 }; yZoomState[ticker] = { padMultiplier: 1 }; yPanState[ticker] = { offset: 0 }; }

        // Shifts the visible window by a fraction of the total data, keeping its width (zoom
        // level) unchanged — this is what dragging the chart actually does. Clamped so the
        // window can never go past the data's start or end.
        function panZoom(ticker, fracDelta) {
            const z = zoomState[ticker] || { start: 0, end: 1 };
            const width = z.end - z.start;
            let newStart = z.start + fracDelta;
            let newEnd = z.end + fracDelta;
            if (newStart < 0) { newStart = 0; newEnd = width; }
            if (newEnd > 1) { newEnd = 1; newStart = 1 - width; }
            zoomState[ticker] = { start: newStart, end: newEnd };
        }

        // Jumps straight to the most recent dates, keeping the current zoom level (window width)
        // — the quick way back to "now" after panning back through history.
        function zoomToNow(ticker) {
            const z = zoomState[ticker] || { start: 0, end: 1 };
            const width = z.end - z.start;
            zoomState[ticker] = { start: Math.max(0, 1 - width), end: 1 };
        }

        // Adjusts the price-axis (Y) auto-fit padding — dragging the price-axis strip up
        // compresses the vertical range (more detail), dragging down expands it (more headroom).
        function adjustYZoom(ticker, factor) {
            if (!yZoomState[ticker]) yZoomState[ticker] = { padMultiplier: 1 };
            yZoomState[ticker].padMultiplier = Math.max(0.15, Math.min(4, yZoomState[ticker].padMultiplier * factor));
        }

        // --- Master Chart Draw ---
        // Single pure-canvas renderer. No Chart.js for the chart itself.
        // Layout: [price+overlays pane] + [oscillator pane if RSI/MACD active]
        function drawChart(ticker) {
            const data = getTickerData(ticker);
            if (!data || !Array.isArray(data.prices) || !data.prices.length || !data.computed) return;

            const canvas = document.getElementById('canvas-' + ticker);
            if (!canvas) return;
            ensureTickerState(ticker);
            const inds = appState.indicators[ticker];
            const computed = data.computed;
            const isLight = document.body.classList.contains('light-mode');

            // Full dataset
            const allPrices = data.prices;
            const allDates  = data.dates || [];
            const allOhlc   = data.ohlc  || [];
            const hasOhlc   = allOhlc.length === allPrices.length && allOhlc.some(c => c && c.h !== null);

            // Apply zoom window
            const { startIdx, endIdx } = getZoom(ticker, allPrices.length);
            const prices = allPrices.slice(startIdx, endIdx);
            const dates  = allDates.slice(startIdx, endIdx);
            const ohlc   = allOhlc.slice(startIdx, endIdx);
            const sl     = prices.length;
            if (!sl) return;

            // Sliced computed arrays
            const sliceArr = (arr) => arr ? arr.slice(startIdx, endIdx) : [];

            // Canvas sizing
            const wrapper = canvas.parentElement;
            const W = wrapper.clientWidth  || 360;
            const hasOsc = inds.rsi || inds.macd;
            const OSC_H  = hasOsc ? 100 : 0;
            const VOL_H  = (inds.volume && hasOhlc) ? Math.floor((W < 400 ? 220 : 260) * 0.18) : 0;
            const PRICE_H = (W < 400 ? 220 : 260) - VOL_H;
            const TOTAL_H = PRICE_H + VOL_H + (hasOsc ? OSC_H + 4 : 0) + 20; // +20 for date axis
            const DATE_H  = 20;
            const PAD_L   = 4;
            const PAD_R   = 54;
            const CW      = W - PAD_L - PAD_R;

            canvas.width  = W;
            canvas.height = TOTAL_H;
            canvas.style.height = TOTAL_H + 'px';
            wrapper.style.height = TOTAL_H + 'px';

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, W, TOTAL_H);

            // Colors
            const C = {
                grid:    isLight ? '#e5e5ea' : '#1e1e2a',
                tick:    isLight ? '#8e8e93' : '#666680',
                bull:    '#00d395',
                bear:    '#ff5c5c',
                sma50:   '#f5a623',
                sma20:   '#5ac8fa',
                sma200:  '#ff9f7f',
                ema20:   '#a78bfa',
                bb:      isLight ? 'rgba(100,100,200,0.4)' : 'rgba(160,160,255,0.4)',
                rsi:     '#b58900',
                macd:    '#d33682',
                sig:     '#859900',
                divider: isLight ? '#d0d0da' : '#2a2a3a',
            };

            // ── HELPERS ──
            const slotW = CW / sl;
            const bodyW = Math.max(1, Math.min(10, slotW * 0.6));
            const toX   = (i) => PAD_L + (i + 0.5) * slotW;

            function makeYScale(values, top, height, pad=0.06, offsetFrac=0) {
                const valids = values.filter(v => v !== null && v !== undefined && !isNaN(v));
                if (!valids.length) return null;
                let vMax = Math.max(...valids);
                let vMin = Math.min(...valids);
                const p = (vMax - vMin) * pad || 1;
                vMax += p; vMin -= p;
                const range = vMax - vMin;
                // Vertical pan: shift the whole visible price window without changing its size.
                const shift = range * offsetFrac;
                vMax += shift; vMin += shift;
                return {
                    vMax, vMin, range,
                    toY: (v) => top + height * (1 - (v - vMin) / range),
                    drawGrid: (steps=4, prefix='$', decimals=2) => {
                        ctx.font = '10px -apple-system,sans-serif';
                        ctx.textAlign = 'right';
                        for (let i=0; i<=steps; i++) {
                            const v = vMin + (range * i / steps);
                            const y = top + height * (1 - i/steps);
                            ctx.strokeStyle = C.grid; ctx.lineWidth = 0.5;
                            ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W-PAD_R+2, y); ctx.stroke();
                            ctx.fillStyle = C.tick;
                            ctx.fillText(prefix + v.toFixed(decimals), W-2, y+3);
                        }
                    }
                };
            }

            // ── PRICE PANE ──
            const priceTop  = 0;
            const priceH    = PRICE_H;
            const volTop    = priceTop + priceH;

            // Price scale from OHLC highs/lows (or prices if no OHLC)
            const priceValues = hasOhlc
                ? [...ohlc.filter(c=>c&&c.h!==null).flatMap(c=>[c.h,c.l])]
                : prices;
            const yPadMult = (yZoomState[ticker] && yZoomState[ticker].padMultiplier) || 1;
            const yOffset = (yPanState[ticker] && yPanState[ticker].offset) || 0;
            const priceScale = makeYScale(priceValues, priceTop, priceH, 0.06 * yPadMult, yOffset);
            if (!priceScale) return;

            priceScale.drawGrid(4, '$', 2);

            // Pivot lines
            if (inds.pivot && hasOhlc) {
                const pv = getPivotPoints(ohlc);
                if (pv) {
                    [{v:pv.r2,l:'R2',c:'#ff5c5c'},{v:pv.r1,l:'R1',c:'#ff9f7f'},
                     {v:pv.pp,l:'PP',c:isLight?'#6060c8':'#a0a0ff'},
                     {v:pv.s1,l:'S1',c:'#5ac8fa'},{v:pv.s2,l:'S2',c:'#00d395'}].forEach(({v,l,c}) => {
                        if (v < priceScale.vMin || v > priceScale.vMax) return;
                        const y = priceScale.toY(v);
                        ctx.save(); ctx.strokeStyle=c; ctx.lineWidth=1; ctx.setLineDash([4,4]);
                        ctx.beginPath(); ctx.moveTo(PAD_L,y); ctx.lineTo(W-PAD_R,y); ctx.stroke();
                        ctx.setLineDash([]); ctx.fillStyle=c; ctx.font='bold 9px -apple-system,sans-serif'; ctx.textAlign='left';
                        ctx.fillText(l, PAD_L+3, y-2); ctx.restore();
                    });
                }
            }

            // MA overlays on price pane
            const drawLine = (arr, color, dash=[]) => {
                if (!arr || !arr.length) return;
                ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.setLineDash(dash);
                ctx.beginPath(); let started=false;
                arr.forEach((v,i) => {
                    if (v===null||v===undefined||isNaN(v)) { started=false; return; }
                    const x=toX(i), y=priceScale.toY(v);
                    if (!started) { ctx.moveTo(x,y); started=true; } else { ctx.lineTo(x,y); }
                });
                ctx.stroke(); ctx.setLineDash([]); ctx.restore();
            };
            if (inds.sma   && computed.sma)   drawLine(sliceArr(computed.sma),   C.sma50,  [5,5]);
            if (inds.sma20 && computed.sma20)  drawLine(sliceArr(computed.sma20), C.sma20,  [5,5]);
            if (inds.sma200&& computed.sma200) drawLine(sliceArr(computed.sma200),C.sma200, [8,4]);
            if (inds.ema20 && computed.ema20)  drawLine(sliceArr(computed.ema20), C.ema20);
            if (inds.bb && computed.bb) {
                drawLine(sliceArr(computed.bb.upper), C.bb);
                drawLine(sliceArr(computed.bb.lower), C.bb);
                // BB fill
                const upper=sliceArr(computed.bb.upper), lower=sliceArr(computed.bb.lower);
                ctx.save(); ctx.fillStyle=isLight?'rgba(100,100,200,0.05)':'rgba(160,160,255,0.07)';
                ctx.beginPath(); let s2=false;
                upper.forEach((v,i)=>{ if(v===null||isNaN(v)){s2=false;return;} const x=toX(i),y=priceScale.toY(v); if(!s2){ctx.moveTo(x,y);s2=true;}else ctx.lineTo(x,y); });
                for(let i=lower.length-1;i>=0;i--){ const v=lower[i]; if(v===null||isNaN(v))continue; ctx.lineTo(toX(i),priceScale.toY(v)); }
                ctx.closePath(); ctx.fill(); ctx.restore();
            }

            // Candlesticks
            if (hasOhlc) {
                ohlc.forEach((c,i) => {
                    if (!c||c.h===null) return;
                    const isBull=c.c>=c.o, color=isBull?C.bull:C.bear, x=toX(i);
                    ctx.strokeStyle=color; ctx.lineWidth=1;
                    ctx.beginPath(); ctx.moveTo(x,priceScale.toY(c.h)); ctx.lineTo(x,priceScale.toY(c.l)); ctx.stroke();
                    const bTop=Math.min(priceScale.toY(c.o),priceScale.toY(c.c));
                    const bH=Math.max(1,Math.abs(priceScale.toY(c.c)-priceScale.toY(c.o)));
                    ctx.fillStyle=isBull?'rgba(0,211,149,0.35)':color;
                    ctx.fillRect(x-bodyW/2,bTop,bodyW,bH); ctx.strokeRect(x-bodyW/2,bTop,bodyW,bH);
                });
            } else {
                drawLine(prices, prices[prices.length-1]>=prices[0]?C.bull:C.bear);
            }

            // Swing markers
            if (inds.swing && hasOhlc) {
                const {highs,lows}=getSwingPoints(ohlc);
                const tri=(x,y,up,color)=>{
                    ctx.save(); ctx.fillStyle=color; ctx.beginPath();
                    const s=5,off=6;
                    if(up){ctx.moveTo(x,y-off-s*1.5);ctx.lineTo(x-s,y-off);ctx.lineTo(x+s,y-off);}
                    else  {ctx.moveTo(x,y+off+s*1.5);ctx.lineTo(x-s,y+off);ctx.lineTo(x+s,y+off);}
                    ctx.closePath(); ctx.fill(); ctx.restore();
                };
                highs.forEach(p=>{if(p.x<sl)tri(toX(p.x),priceScale.toY(p.y),false,C.bear);});
                lows.forEach(p=>{if(p.x<sl)tri(toX(p.x),priceScale.toY(p.y),true,C.bull);});
            }

            // Volume bars
            if (inds.volume && hasOhlc && VOL_H > 0) {
                const maxVol=Math.max(...ohlc.map(c=>c?.v||0))||1;
                ohlc.forEach((c,i)=>{
                    if(!c||!c.v)return;
                    const bh=(c.v/maxVol)*(VOL_H-4);
                    ctx.fillStyle=c.c>=c.o?'rgba(0,211,149,0.28)':'rgba(255,92,92,0.28)';
                    ctx.fillRect(toX(i)-bodyW/2, volTop+VOL_H-4-bh, bodyW, bh);
                });
                ctx.fillStyle=C.tick; ctx.font='9px -apple-system,sans-serif'; ctx.textAlign='right';
                ctx.fillText('Vol', W-2, volTop+12);
            }

            // ── OSCILLATOR PANE ──
            if (hasOsc) {
                const oscTop = PRICE_H + VOL_H + 4;
                const oscH   = OSC_H;

                // Divider line
                ctx.strokeStyle=C.divider; ctx.lineWidth=1;
                ctx.beginPath(); ctx.moveTo(PAD_L,oscTop); ctx.lineTo(W-PAD_R,oscTop); ctx.stroke();

                if (inds.rsi && computed.rsi) {
                    const rsiArr = sliceArr(computed.rsi);
                    const oscScale = makeYScale([0,100], oscTop, oscH, 0);
                    if (oscScale) {
                        // Grid lines at 30/50/70
                        [30,50,70].forEach(level => {
                            const y = oscScale.toY(level);
                            ctx.strokeStyle=level===50?C.grid:'rgba(180,120,0,0.3)'; ctx.lineWidth=0.5;
                            ctx.setLineDash(level===50?[]:[3,3]);
                            ctx.beginPath(); ctx.moveTo(PAD_L,y); ctx.lineTo(W-PAD_R,y); ctx.stroke();
                            ctx.setLineDash([]);
                            ctx.fillStyle=C.tick; ctx.font='9px -apple-system,sans-serif'; ctx.textAlign='right';
                            ctx.fillText(level, W-2, y+3);
                        });
                        // RSI fill zones
                        ctx.save();
                        ctx.fillStyle='rgba(255,92,92,0.1)';
                        ctx.fillRect(PAD_L, oscTop, CW, oscScale.toY(70)-oscTop);
                        ctx.fillStyle='rgba(0,211,149,0.1)';
                        ctx.fillRect(PAD_L, oscScale.toY(30), CW, oscTop+oscH-oscScale.toY(30));
                        ctx.restore();
                        // RSI line
                        ctx.save(); ctx.strokeStyle=C.rsi; ctx.lineWidth=1.5;
                        ctx.beginPath(); let s3=false;
                        rsiArr.forEach((v,i)=>{ if(v===null||isNaN(v)){s3=false;return;} const x=toX(i),y=oscScale.toY(Math.max(0,Math.min(100,v))); if(!s3){ctx.moveTo(x,y);s3=true;}else ctx.lineTo(x,y); });
                        ctx.stroke(); ctx.restore();
                        // RSI label
                        ctx.fillStyle=C.rsi; ctx.font='bold 9px -apple-system,sans-serif'; ctx.textAlign='left';
                        ctx.fillText('RSI', PAD_L+3, oscTop+12);
                    }
                }

                if (inds.macd && computed.macd) {
                    const macdArr  = sliceArr(computed.macd.macd);
                    const sigArr   = sliceArr(computed.macd.signal);
                    const combined = [...macdArr, ...sigArr].filter(v=>v!==null&&!isNaN(v));
                    const oscScale = makeYScale(combined, oscTop, oscH);
                    if (oscScale) {
                        // Zero line
                        if (oscScale.vMin < 0 && oscScale.vMax > 0) {
                            const zeroY = oscScale.toY(0);
                            ctx.strokeStyle=C.divider; ctx.lineWidth=0.5;
                            ctx.beginPath(); ctx.moveTo(PAD_L,zeroY); ctx.lineTo(W-PAD_R,zeroY); ctx.stroke();
                        }
                        // MACD histogram (difference bars)
                        macdArr.forEach((v,i)=>{
                            if(v===null||isNaN(v)||!sigArr[i]||isNaN(sigArr[i]))return;
                            const diff=v-sigArr[i];
                            const zeroY=oscScale.vMin<0&&oscScale.vMax>0?oscScale.toY(0):oscScale.toY(oscScale.vMin);
                            const topY=oscScale.toY(diff);
                            const bh=Math.abs(topY-zeroY)||1;
                            ctx.fillStyle=diff>=0?'rgba(0,211,149,0.4)':'rgba(255,92,92,0.4)';
                            ctx.fillRect(toX(i)-bodyW/2, Math.min(topY,zeroY), bodyW, bh);
                        });
                        // MACD + Signal lines
                        const drawOscLine=(arr,color,dash=[])=>{
                            ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.setLineDash(dash);
                            ctx.beginPath(); let st=false;
                            arr.forEach((v,i)=>{ if(v===null||isNaN(v)){st=false;return;} const x=toX(i),y=oscScale.toY(v); if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y); });
                            ctx.stroke(); ctx.setLineDash([]); ctx.restore();
                        };
                        drawOscLine(macdArr, C.macd);
                        drawOscLine(sigArr,  C.sig, [3,3]);
                        ctx.fillStyle=C.macd; ctx.font='bold 9px -apple-system,sans-serif'; ctx.textAlign='left';
                        ctx.fillText('MACD', PAD_L+3, oscTop+12);
                    }
                }
            }

            // ── DATE AXIS ──
            const dateY = PRICE_H + VOL_H + (hasOsc ? OSC_H+4 : 0) + DATE_H - 4;
            ctx.fillStyle=C.tick; ctx.font='9px -apple-system,sans-serif'; ctx.textAlign='center';
            const every=Math.max(1,Math.floor(sl/8));
            dates.forEach((d,i)=>{ if(i%every===0) ctx.fillText(d, toX(i), dateY); });

            // ── CROSSHAIR CANVAS ──
            const crossCanvas = document.getElementById('canvas-cross-' + ticker);
            if (!crossCanvas) return;
            crossCanvas.width  = W;
