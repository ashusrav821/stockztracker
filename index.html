            crossCanvas.height = TOTAL_H;
            crossCanvas.style.height = TOTAL_H + 'px';

            // Store layout for crosshair reuse
            crossCanvas._layout = { W, PRICE_H, VOL_H, OSC_H, DATE_H, hasOsc, PAD_L, PAD_R, CW, sl, slotW, priceScale, isLight, C, hasOhlc, ohlc, prices, dates, inds, computed, startIdx, endIdx };

            const newCross = crossCanvas.cloneNode(true);
            newCross._layout = crossCanvas._layout;
            crossCanvas.parentNode.replaceChild(newCross, crossCanvas);

            const drawCrosshair = (clientX, clientY) => {
                const L = newCross._layout;
                if (!L) return;
                const rect  = newCross.getBoundingClientRect();
                const px    = (clientX - rect.left) * (L.W / rect.width);
                const idx   = Math.max(0, Math.min(L.sl-1, Math.round((px-L.PAD_L)/L.slotW-0.5)));
                const x     = L.PAD_L + (idx+0.5)*L.slotW;
                const ctx2  = newCross.getContext('2d');
                ctx2.clearRect(0, 0, L.W, newCross.height);

                // Vertical line
                ctx2.strokeStyle=L.isLight?'rgba(0,0,0,0.25)':'rgba(255,255,255,0.25)';
                ctx2.lineWidth=1; ctx2.setLineDash([4,3]);
                ctx2.beginPath(); ctx2.moveTo(x,0); ctx2.lineTo(x, newCross.height-L.DATE_H); ctx2.stroke(); ctx2.setLineDash([]);

                // Date pill
                const dateLabel=L.dates[idx]||'';;
                ctx2.font='bold 10px -apple-system,sans-serif'; ctx2.textAlign='center';
                const dw=ctx2.measureText(dateLabel).width+12;
                const dx=Math.max(dw/2+L.PAD_L, Math.min(L.W-L.PAD_R-dw/2, x));
                ctx2.fillStyle=L.isLight?'#444':'#bbb';
                ctx2.roundRect(dx-dw/2, newCross.height-L.DATE_H+2, dw, L.DATE_H-6, 4); ctx2.fill();
                ctx2.fillStyle=L.isLight?'#fff':'#111'; ctx2.fillText(dateLabel, dx, newCross.height-L.DATE_H+L.DATE_H-8);

                // Price label on right axis
                const c=L.hasOhlc?L.ohlc[idx]:null;
                const closePrice=c?c.c:L.prices[idx];
                if (closePrice!==null && L.priceScale) {
                    const py=L.priceScale.toY(closePrice);
                    if (py>0 && py<L.PRICE_H) {
                        // Horizontal dotted line
                        ctx2.strokeStyle=L.isLight?'rgba(0,0,0,0.15)':'rgba(255,255,255,0.15)';
                        ctx2.lineWidth=1; ctx2.setLineDash([3,3]);
                        ctx2.beginPath(); ctx2.moveTo(x,py); ctx2.lineTo(L.W-L.PAD_R+2,py); ctx2.stroke(); ctx2.setLineDash([]);
                        // Price pill
                        const priceLabel='$'+closePrice.toFixed(2);
                        ctx2.font='bold 10px -apple-system,sans-serif'; ctx2.textAlign='left';
                        const pw=ctx2.measureText(priceLabel).width+8;
                        const priceColor=c?(c.c>=c.o?'#00d395':'#ff5c5c'):'#00d395';
                        ctx2.fillStyle=priceColor;
                        ctx2.roundRect(L.W-L.PAD_R+3, py-8, pw, 16, 3); ctx2.fill();
                        ctx2.fillStyle='#fff'; ctx2.fillText(priceLabel, L.W-L.PAD_R+7, py+4);
                    }
                }

                // Tooltip below chart
                const fmt=(v,d=2)=>(v===null||v===undefined||isNaN(v))?'—':Number(v).toFixed(d);
                const getAt=(arr,i)=>(arr&&arr[i]!==undefined)?arr[i]:null;
                const parts=[];
                if(c&&c.o!==null){
                    parts.push({n:'O',c:'#888',v:fmt(c.o)});
                    parts.push({n:'H',c:'#00d395',v:fmt(c.h)});
                    parts.push({n:'L',c:'#ff5c5c',v:fmt(c.l)});
                    parts.push({n:'C',c:c.c>=c.o?'#00d395':'#ff5c5c',v:fmt(c.c)});
                    if(L.inds.volume&&c.v)parts.push({n:'Vol',c:'#888',v:(c.v/1e6).toFixed(2)+'M'});
                } else { parts.push({n:'Price',c:'#00d395',v:fmt(L.prices[idx])}); }
                const comp2=L.computed;
                if(L.inds.sma&&comp2.sma)parts.push({n:'SMA50',c:'#f5a623',v:fmt(getAt(comp2.sma.slice(L.startIdx,L.endIdx),idx))});
                if(L.inds.sma20&&comp2.sma20)parts.push({n:'SMA20',c:'#5ac8fa',v:fmt(getAt(comp2.sma20.slice(L.startIdx,L.endIdx),idx))});
                if(L.inds.sma200&&comp2.sma200)parts.push({n:'SMA200',c:'#ff9f7f',v:fmt(getAt(comp2.sma200.slice(L.startIdx,L.endIdx),idx))});
                if(L.inds.ema20&&comp2.ema20)parts.push({n:'EMA20',c:'#a78bfa',v:fmt(getAt(comp2.ema20.slice(L.startIdx,L.endIdx),idx))});
                if(L.inds.rsi&&comp2.rsi)parts.push({n:'RSI',c:'#b58900',v:fmt(getAt(comp2.rsi.slice(L.startIdx,L.endIdx),idx),1)});
                if(L.inds.macd&&comp2.macd){
                    parts.push({n:'MACD',c:'#d33682',v:fmt(getAt(comp2.macd.macd.slice(L.startIdx,L.endIdx),idx))});
                    parts.push({n:'Sig',c:'#859900',v:fmt(getAt(comp2.macd.signal.slice(L.startIdx,L.endIdx),idx))});
                }
                const tip=document.getElementById('xhair-'+ticker);
                if(tip){
                    tip.style.display='flex';
                    tip.innerHTML=`<span style="font-size:0.7rem;color:var(--text-sub);font-weight:700;margin-right:6px;">${dateLabel}</span>`
                        +parts.map(p=>`<span class="xhair-item"><span class="xhair-dot" style="background:${p.c}"></span><span class="xhair-name">${p.n}</span><span class="xhair-val">${p.v}</span></span>`).join('');
                }
            };

            const clearCrosshair=()=>{
                const ctx2=newCross.getContext('2d'); ctx2.clearRect(0,0,newCross.width,newCross.height);
                const tip=document.getElementById('xhair-'+ticker); if(tip)tip.style.display='none';
            };

            // ── Mouse: drag to pan both axes, move to show crosshair ──
            // Panning was previously touch-only, so on desktop there was no way to scroll the
            // chart at all once zoomed in. Dragging now pans time (horizontal) and price
            // (vertical) simultaneously, the way TradingView behaves. Dragging over the price
            // axis strip pans price only.
            let mouseDrag = null;
            newCross.addEventListener('mousedown',(e)=>{
                if (isSyntheticMouseEvent()) return; // synthetic event echoing a touch — touch path owns this
                const rect = newCross.getBoundingClientRect();
                const px = (e.clientX - rect.left) * (W / rect.width);
                const z = zoomState[ticker] || { start: 0, end: 1 };
                mouseDrag = {
                    startX: e.clientX, startY: e.clientY,
                    startZoomStart: z.start, startZoomEnd: z.end,
                    startYOffset: (yPanState[ticker] && yPanState[ticker].offset) || 0,
                    priceAxisOnly: px > W - PAD_R,
                    moved: false,
                };
                newCross.style.cursor = 'grabbing';
            });

            newCross.addEventListener('mousemove',(e)=>{
                if (isSyntheticMouseEvent()) return; // touch already drew/handled this
                if (!mouseDrag) { drawCrosshair(e.clientX,e.clientY); return; }

                const dx = e.clientX - mouseDrag.startX;
                const dy = e.clientY - mouseDrag.startY;
                if (!mouseDrag.moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return; // ignore jitter on a click
                mouseDrag.moved = true;
                clearCrosshair();

                if (!mouseDrag.priceAxisOnly) {
                    const width = mouseDrag.startZoomEnd - mouseDrag.startZoomStart;
                    const fracDelta = -(dx / W) * width; // drag right → reveal earlier dates
                    let ns = mouseDrag.startZoomStart + fracDelta;
                    let ne = mouseDrag.startZoomEnd + fracDelta;
                    if (ns < 0) { ns = 0; ne = width; }
                    if (ne > 1) { ne = 1; ns = 1 - width; }
                    zoomState[ticker] = { start: ns, end: ne };
                }
                // Dragging down should move the view toward lower prices (content follows cursor).
                const yFrac = (dy / PRICE_H);
                yPanState[ticker] = { offset: Math.max(-3, Math.min(3, mouseDrag.startYOffset + yFrac)) };
                scheduleDraw();
            });

            newCross.addEventListener('mouseup',()=>{ mouseDrag = null; newCross.style.cursor = 'crosshair'; });
            newCross.addEventListener('mouseleave',()=>{
                mouseDrag = null;
                newCross.style.cursor = 'crosshair';
                if (!isSyntheticMouseEvent()) clearCrosshair(); // don't wipe a crosshair a tap just drew
            });
            newCross.style.cursor = 'crosshair';

            // Scroll wheel: zooms time by default; zooms the price axis instead when the
            // pointer is over the price-axis label strip on the right edge (mirrors dragging it).
            newCross.addEventListener('wheel',(e)=>{
                e.preventDefault();
                const rect = newCross.getBoundingClientRect();
                const px = (e.clientX - rect.left) * (W / rect.width);
                if (px > W - PAD_R) {
                    adjustYZoom(ticker, e.deltaY < 0 ? 0.9 : 1.1);
                } else if (e.deltaY < 0) {
                    zoomIn(ticker, allPrices.length);
                } else {
                    zoomOut(ticker, allPrices.length);
                }
                drawChart(ticker);
            },{passive:false});

            // ── Unified touch gestures ──
            // 1 finger, main chart area  → drag to pan through time; tap for crosshair
            // 1 finger, price-axis strip → drag up/down to rescale the Y-axis
            // 2 fingers, anywhere        → pinch to zoom time
            // rAF-batched redraws so a fast drag can't queue up more canvas rebuilds than can
            // actually paint; W (not newCross.clientWidth) is used throughout since drawChart
            // clones/replaces this canvas on every redraw — a live DOM query mid-gesture would
            // increasingly read from a detached, stale node.
            let touchState = null;
            let rafPending = false;
            const GESTURE_THRESHOLD = 8; // px before committing to pan vs vertical page-scroll
            function scheduleDraw() {
                if (rafPending) return;
                rafPending = true;
                requestAnimationFrame(() => { rafPending = false; drawChart(ticker); });
            }

            newCross.addEventListener('touchstart',(e)=>{
                _lastTouchAt = Date.now();
                if (e.touches.length === 2) {
                    touchState = { mode: 'pinch', lastPinchDist: Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY) };
                    clearCrosshair();
                    return;
                }
                if (e.touches.length === 1) {
                    const rect = newCross.getBoundingClientRect();
                    const px = (e.touches[0].clientX - rect.left) * (W / rect.width);
                    const onPriceAxis = px > W - PAD_R;
                    const z = zoomState[ticker] || { start: 0, end: 1 };
                    touchState = {
                        mode: onPriceAxis ? 'yaxis' : 'undecided',
                        startX: e.touches[0].clientX,
                        startY: e.touches[0].clientY,
                        startZoomStart: z.start,
                        startZoomEnd: z.end,
                        startYOffset: (yPanState[ticker] && yPanState[ticker].offset) || 0,
                    };
                    if (!onPriceAxis) drawCrosshair(e.touches[0].clientX, e.touches[0].clientY); // instant tap feedback
                }
            },{passive:true});

            newCross.addEventListener('touchmove',(e)=>{
                _lastTouchAt = Date.now();
                if (!touchState) return;

                if (touchState.mode === 'pinch' && e.touches.length === 2) {
                    e.preventDefault();
                    const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
                    if(dist>touchState.lastPinchDist*1.06)zoomIn(ticker,allPrices.length);
                    else if(dist<touchState.lastPinchDist*0.94)zoomOut(ticker,allPrices.length);
                    touchState.lastPinchDist=dist;
                    scheduleDraw();
                    return;
                }
                if (e.touches.length !== 1) return;

                const dx = e.touches[0].clientX - touchState.startX;
                const dy = e.touches[0].clientY - touchState.startY;

                if (touchState.mode === 'yaxis') {
                    e.preventDefault();
                    adjustYZoom(ticker, dy < 0 ? 0.985 : 1.015);
                    touchState.startY = e.touches[0].clientY; // incremental — each move nudges further
                    scheduleDraw();
                    return;
                }

                if (touchState.mode === 'undecided') {
                    if (Math.abs(dx) < GESTURE_THRESHOLD && Math.abs(dy) < GESTURE_THRESHOLD) return;
                    touchState.mode = Math.abs(dx) > Math.abs(dy) ? 'pan' : 'vscroll';
                    clearCrosshair(); // committing to a real gesture — drop the tap-preview crosshair
                    if (touchState.mode === 'vscroll') return; // dominant axis is vertical — let the page scroll normally
                }

                if (touchState.mode === 'pan') {
                    e.preventDefault();
                    const width = touchState.startZoomEnd - touchState.startZoomStart;
                    const fracDelta = -(dx / W) * width; // drag right → reveal earlier dates
                    let newStart = touchState.startZoomStart + fracDelta;
                    let newEnd = touchState.startZoomEnd + fracDelta;
                    if (newStart < 0) { newStart = 0; newEnd = width; }
                    if (newEnd > 1) { newEnd = 1; newStart = 1 - width; }
                    zoomState[ticker] = { start: newStart, end: newEnd };
                    // Once the gesture is already committed to panning the chart, vertical
                    // movement pans the price axis too — free 2D panning without ever stealing
                    // page scroll, since we only get here after horizontal motion dominated.
                    const yFrac = dy / PRICE_H;
                    yPanState[ticker] = { offset: Math.max(-3, Math.min(3, touchState.startYOffset + yFrac)) };
                    scheduleDraw();
                }
                // mode === 'vscroll': nothing to do — no preventDefault means native scroll proceeds
            },{passive:false});

            newCross.addEventListener('touchend',()=>{ _lastTouchAt = Date.now(); touchState = null; },{passive:true});

            // ── LEGEND ──
            const lastValid=(arr)=>{
                if(!arr?.length)return null;
                for(let i=arr.length-1;i>=0;i--){if(arr[i]!==null&&arr[i]!==undefined&&!isNaN(arr[i]))return arr[i];}
                return null;
            };
            const fmt2=(v,d=2)=>v===null?'—':Number(v).toFixed(d);
            const lastC=hasOhlc?ohlc[ohlc.length-1]:null;
            const items=[];
            if(lastC?.o!==null&&lastC?.o!==undefined){
                items.push({n:'O',c:'#888',v:fmt2(lastC.o)});
                items.push({n:'H',c:C.bull,v:fmt2(lastC.h)});
                items.push({n:'L',c:C.bear,v:fmt2(lastC.l)});
                items.push({n:'C',c:lastC.c>=lastC.o?C.bull:C.bear,v:fmt2(lastC.c)});
                if(inds.volume&&lastC.v)items.push({n:'Vol',c:'#888',v:(lastC.v/1e6).toFixed(2)+'M'});
            } else { items.push({n:'Price',c:C.bull,v:fmt2(prices[prices.length-1])}); }
            if(inds.sma&&computed.sma)items.push({n:'SMA50',c:C.sma50,v:fmt2(lastValid(sliceArr(computed.sma)))});
            if(inds.sma20&&computed.sma20)items.push({n:'SMA20',c:C.sma20,v:fmt2(lastValid(sliceArr(computed.sma20)))});
            if(inds.sma200&&computed.sma200)items.push({n:'SMA200',c:C.sma200,v:fmt2(lastValid(sliceArr(computed.sma200)))});
            if(inds.ema20&&computed.ema20)items.push({n:'EMA20',c:C.ema20,v:fmt2(lastValid(sliceArr(computed.ema20)))});
            if(inds.bb&&computed.bb){items.push({n:'BB↑',c:C.bb,v:fmt2(lastValid(sliceArr(computed.bb.upper)))});items.push({n:'BB↓',c:C.bb,v:fmt2(lastValid(sliceArr(computed.bb.lower)))});}
            if(inds.rsi&&computed.rsi)items.push({n:'RSI',c:C.rsi,v:fmt2(lastValid(sliceArr(computed.rsi)),1)});
            if(inds.macd&&computed.macd){items.push({n:'MACD',c:C.macd,v:fmt2(lastValid(sliceArr(computed.macd.macd)))});items.push({n:'Sig',c:C.sig,v:fmt2(lastValid(sliceArr(computed.macd.signal)))});}
            if(computed.adx){const av=lastValid(sliceArr(computed.adx));items.push({n:'ADX',c:av!==null&&av>25?C.bull:C.bear,v:av===null?'—':av.toFixed(1)});}
            const leg=document.getElementById('legend-'+ticker);
            if(leg)leg.innerHTML=items.map(it=>`<span class="legend-item"><span class="legend-dot" style="background:${it.c}"></span><span class="legend-name">${it.n}</span><span class="legend-value">${it.v}</span></span>`).join('');
        }
        // --- App Interactions ---
        // Expands/collapses a whole card: the action icon row (chart/news/alerts/remove) and
        // any open panels only render while expanded, so a collapsed card is just its summary —
        // no risk of the action row getting clipped at the bottom of a long list.
        function toggleCardExpanded(ticker) {
            appState.ui.cardExpanded[ticker] = !appState.ui.cardExpanded[ticker];
            renderUI();
        }

        async function toggleUI(ticker, type, key) {
            if (type === 'panel') {
                let state = appState.ui[key][ticker];
                appState.ui.charts[ticker] = appState.ui.news[ticker] = appState.ui.alerts[ticker] = false;
                appState.ui[key][ticker] = !state;

                if (key === 'news' && !appState.newsCache[ticker]) {
                    renderUI();
                    appState.newsCache[ticker] = await fetchNews(ticker);
                }
                // Panel toggle always needs full render (panel visibility changes DOM structure)
                renderUI();
                return;
            }

            if (type === 'ind') {
                const newVal = !appState.indicators[ticker][key];
                appState.indicators[ticker][key] = newVal;
                // Targeted: just toggle the button class and redraw this ticker's chart
                updateIndicatorButton(ticker, key, newVal);
                // Debounced localStorage write
                clearTimeout(_indSaveTimer);
                _indSaveTimer = setTimeout(() => {
                    localStorage.setItem('indicators', JSON.stringify(appState.indicators));
                }, 500);
                // Redraw only this ticker's chart (not all cards)
                if (appState.ui.charts[ticker] && getTickerData(ticker)) {
                    try { drawChart(ticker); } catch(e) { console.error('drawChart failed:', e); }
                }
                return;
            }
        }
        let _indSaveTimer = null;

        // --- Ticker / company-name search-as-you-type ---
        let _tickerSearchTimer = null;
        let _tickerSearchSeq = 0; // guards against a slow earlier request overwriting a faster later one

        function onTickerInputChange(value) {
            clearTimeout(_tickerSearchTimer);
            const q = value.trim();
            if (q.length < 2) { hideTickerSearchDropdown(); return; }
            _tickerSearchTimer = setTimeout(() => runTickerSearch(q), 300);
        }

        async function runTickerSearch(q) {
            const seq = ++_tickerSearchSeq;
            try {
                const res = await fetch(`${CONFIG.WORKER_BASE}/api/search-ticker?q=${encodeURIComponent(q)}`);
                if (seq !== _tickerSearchSeq) return; // a newer keystroke already superseded this request
                if (!res.ok) { hideTickerSearchDropdown(); return; }
                const data = await res.json();
                renderTickerSearchDropdown(data.results || []);
            } catch (e) {
                if (seq === _tickerSearchSeq) hideTickerSearchDropdown();
            }
        }

        function renderTickerSearchDropdown(results) {
            const dropdown = document.getElementById('tickerSearchDropdown');
            if (!dropdown) return;
            if (!results.length) {
                dropdown.innerHTML = '<div class="ticker-search-empty">No matches</div>';
                dropdown.style.display = 'block';
                return;
            }
            dropdown.innerHTML = results.map(r => `
                <div class="ticker-search-item" onmousedown="event.preventDefault()" onclick="selectTickerSearchResult('${r.symbol.replace(/'/g,"\\'")}')">
                    <span class="ticker-search-symbol">${escapeHtml(r.symbol)}${r.exchange ? ' · ' + escapeHtml(r.exchange) : ''}</span>
                    <span class="ticker-search-name">${escapeHtml(r.name)}</span>
                </div>`).join('');
            dropdown.style.display = 'block';
        }

        function hideTickerSearchDropdown() {
            const dropdown = document.getElementById('tickerSearchDropdown');
            if (dropdown) dropdown.style.display = 'none';
        }

        function selectTickerSearchResult(symbol) {
            const input = document.getElementById('tickerInput');
            if (input) input.value = symbol;
            hideTickerSearchDropdown();
            addStock();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-inline')) hideTickerSearchDropdown();
        });

        function addStock() {
            const val = document.getElementById('tickerInput').value.toUpperCase().trim();
            const input = document.getElementById('tickerInput');

            if (!val) return;

            // Validate ticker format: 1–6 uppercase letters/numbers, optionally with . or -
            // Rejects full names like "Netflix", "Apple Inc", etc.
            if (!/^[A-Z0-9]{1,6}([.\-][A-Z0-9]{1,4})?$/.test(val)) {
                input.style.borderColor = 'var(--sell-color)';
                input.placeholder = 'Use symbol e.g. NFLX, AAPL';
                setTimeout(() => {
                    input.style.borderColor = '';
                    input.placeholder = 'Ticker or company…';
                }, 2500);
                return;
            }

            if (activeWatchlist().includes(val)) {
                input.style.borderColor = 'var(--hold-color)';
                input.placeholder = `${val} already added`;
                setTimeout(() => {
                    input.style.borderColor = '';
                    input.placeholder = 'Ticker or company…';
                }, 2000);
                return;
            }

            activeWatchlist().unshift(val);
            persistWatchlist();
            input.value = '';
            hideTickerSearchDropdown();
            document.getElementById('watchlist').innerHTML = '<div class="info-card">Fetching...</div>';
            updateData();
        }

        // --- Undo snackbar ---
        // Destructive actions apply immediately and offer a time-limited undo instead of asking
        // for confirmation up front. Undo restores from a snapshot of the exact state that was
        // removed (including alert rules purged by purgeOrphanedTickerState), so it's a true
        // revert rather than a partial re-add.
        let _snackTimer = null;
        let _pendingUndo = null;

        function hideSnackbar() {
            clearTimeout(_snackTimer);
            document.getElementById('snackbar').classList.remove('visible');
            _pendingUndo = null;
        }

        // Plain message toast — same element as the undo snackbar, with the action button
        // hidden. Used for feedback that must be visible while the sync drawer is collapsed.
        function showToast(message, duration = 5000) {
            const bar = document.getElementById('snackbar');
            const msgEl = document.getElementById('snackbarMsg');
            const actionEl = document.getElementById('snackbarAction');
            if (!bar || !msgEl || !actionEl) return;
            clearTimeout(_snackTimer);
            _pendingUndo = null;
            msgEl.textContent = message;
            actionEl.style.display = 'none';
            bar.classList.add('visible');
            _snackTimer = setTimeout(hideSnackbar, duration);
        }

        function showUndoSnackbar(message, undoFn, duration = 6000) {
            const bar = document.getElementById('snackbar');
            const msgEl = document.getElementById('snackbarMsg');
            const actionEl = document.getElementById('snackbarAction');
            if (!bar || !msgEl || !actionEl) return;

            clearTimeout(_snackTimer);
            _pendingUndo = undoFn;
            msgEl.textContent = message;
            actionEl.textContent = 'Undo';
            actionEl.style.display = ''; // showToast hides this — restore it or undo silently breaks
            bar.classList.add('visible');

            actionEl.onclick = () => {
                if (_pendingUndo) _pendingUndo();
                hideSnackbar();
            };
            _snackTimer = setTimeout(hideSnackbar, duration);
        }

        function deleteStock(ticker) {
            // Snapshot everything that's about to be removed so Undo can fully restore it.
            const listName = appState.activeList;
            const index = activeWatchlist().indexOf(ticker);
            const alertsSnapshot = appState.alerts[ticker] ? JSON.parse(JSON.stringify(appState.alerts[ticker])) : null;
            const indicatorsSnapshot = appState.indicators[ticker] ? JSON.parse(JSON.stringify(appState.indicators[ticker])) : null;

            appState.watchlists[listName] = activeWatchlist().filter(t => t !== ticker);
            purgeOrphanedTickerState(ticker);
            persistWatchlist();
            renderUI();

            showUndoSnackbar(`Removed ${ticker}`, () => {
                const list = appState.watchlists[listName];
                if (!list) return; // the whole list was deleted in the meantime — nothing to restore into
                if (!list.includes(ticker)) list.splice(index < 0 ? 0 : index, 0, ticker); // back in its original position
                if (alertsSnapshot) {
                    appState.alerts[ticker] = alertsSnapshot;
                    localStorage.setItem('alerts', JSON.stringify(appState.alerts));
                    syncAlertsToServer();
                }
                if (indicatorsSnapshot) appState.indicators[ticker] = indicatorsSnapshot;
                persistWatchlist();
                updateData();
            });
        }

        function retryStock(ticker) {
            ensureTickerState(ticker);
            delete appState.errors[ticker];
            renderUI();
            (async () => {
                const tf = getActiveTf(ticker);
                const key = getTfKey(ticker, tf);
                try {
                    const data = await fetchStockData(ticker, tf);
                    if (!Array.isArray(data.prices) || !data.prices.length) {
                        throw new Error('No price data returned');
                    }
                    data.computed = computeIndicatorSet(data.prices, data.ohlc);
                    appState.dataCache[key] = data;
                    delete appState.errors[ticker];
                } catch(e) {
                    appState.errors[ticker] = e.message || 'Failed to load';
                    delete appState.dataCache[key];
                }
                renderUI();
            })();
        }

        // Guardrail: if anything unforeseen crashes outside our try/catch blocks,
        // show it instead of leaving a silent "Initializing Data..." or blank page.
        window.addEventListener('error', (event) => {
            console.error('Unhandled error:', event.error);
            const container = document.getElementById('watchlist');
            if (container && container.innerHTML.includes('Initializing Data')) {
                container.innerHTML = `<div class="info-card error-card">
                    <div>Something went wrong loading the app: ${event.message || 'unknown error'}</div>
                    <button class="retry-btn" onclick="location.reload()">Reload</button>
                </div>`;
            }
        });
        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
        });

        // Initialize App
        document.getElementById('tickerInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addStock();
        });
        renderListSwitcher();
        document.getElementById('listSwitcher').style.display = 'flex'; // Portfolio is the default active tab
        document.getElementById('sortBarPortfolio').innerHTML = getSortSelectHTML('portfolio');
        document.getElementById('sortBarPortfolio').style.display = 'block';
        if (!localStorage.getItem('tipsDismissed')) {
            document.getElementById('firstRunTip').style.display = 'flex';
        }
        refreshInstallUI(); // not gated on beforeinstallprompt — the affordance is always available
        document.getElementById('pinInput').value = appState.pin; // always set now (auto-generated if new)
        document.getElementById('syncBadgeDrawer').innerHTML = getSyncBadgeHTML();

        if (_hadExistingPin) {
            // Returning user — pull whatever's already synced (rules' armed/lastTriggered state
            // lives server-side, and so does sort preference) rather than overwriting the cloud
            // with local state.
            Promise.all([loadAlertsFromServer(), loadPrefsFromServer()]).then(([alertsOk]) => {
                appState.cloudSynced = alertsOk;
                refreshSyncBadges();
                renderUI();
                if (appState.ui.activeTab === 'alerts') renderAlertsTab();
            });
        } else {
            // First-ever launch: push the current local state to the freshly generated PIN so
            // cloud sync — and therefore working alerts — is active immediately, no setup required.
            persistWatchlist();
            syncAlertsToServer();
            syncPrefsToServer();
        }
        updateData();
        setInterval(() => updateData(true), CONFIG.REFRESH_MS);

        // Reflect existing push subscription state, if already enabled on this device
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            navigator.serviceWorker.ready.then(reg => reg.pushManager.getSubscription()).then(sub => {
                if (sub) {
                    appState.pushEnabled = true;
                    const btn = document.getElementById('pushBtn');
                    if (btn) btn.textContent = '🔔 Watch Alerts Enabled';
                    refreshSyncBadges();
                }
            }).catch(() => {});
        }
    </script>
</body>
</html>
